<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>NOVA PLAY — демо-гра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg-0:#000000; --bg-1:#0d0d0f; --bg-2:#18181b; --bg-2-hover:#212124;
    --line:#26262a; --text-0:#f5f5f7; --text-1:#8e8e93; --text-2:#57575c;
    --brand-grad: linear-gradient(135deg,#8a4dff 0%,#ff3d8a 100%);
    --red: linear-gradient(180deg,#ff5470 0%,#ef2b4d 100%);
    --success:#30d158; --danger:#ff453a; --warn:#ffb020;
    --gold: linear-gradient(135deg,#f3dfa8,#c9a961);
    --radius-l:26px; --radius-m:18px; --radius-s:12px;
    --shadow-card: 0 24px 60px -22px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.03);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg-0); color:var(--text-0); font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif; display:flex; justify-content:center; min-height:100%;}
  .num{font-family:'JetBrains Mono',monospace;}
  #app{width:100%; max-width:440px; min-height:100vh; display:flex; flex-direction:column; position:relative; padding:0 20px 90px;}
  ::selection{background:#ff3d8a; color:#fff;}
  button{font-family:inherit;}

  /* demo banner */
  .demo-banner{
    position:sticky; top:0; z-index:60; margin:0 -20px; padding:9px 16px;
    background:repeating-linear-gradient(135deg,#3a2a00,#3a2a00 10px,#241a00 10px,#241a00 20px);
    border-bottom:1px solid #5a4200; color:#ffd873; font-size:11.5px; font-weight:800;
    text-align:center; letter-spacing:.03em;
  }

  .screen{display:flex; flex-direction:column; flex:1; animation: screenIn .45s cubic-bezier(.19,1,.22,1);}
  @keyframes screenIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand .mark{width:26px;height:26px;border-radius:8px; background:var(--brand-grad); display:flex;align-items:center;justify-content:center; flex-shrink:0;}
  .brand .mark svg{width:14px;height:14px;}
  .brand span{font-weight:800; letter-spacing:.4px; font-size:15px; color:var(--text-0);}

  input, select{
    width:100%; background:var(--bg-2); border:1.5px solid var(--line); color:var(--text-0);
    border-radius:var(--radius-s); padding:16px 16px; font-size:16px; font-family:inherit; outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  input.num{font-family:'JetBrains Mono',monospace; letter-spacing:1px;}
  input::placeholder{color:var(--text-2);}
  input:focus, select:focus{border-color:#8a4dff; background:var(--bg-2-hover);}
  input.error{border-color:var(--danger);}
  input:disabled{opacity:.5;}

  .btn{border:none; border-radius:var(--radius-s); padding:16px 20px; font-size:16px; font-weight:700; cursor:pointer;
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .15s ease, filter .15s ease, opacity .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:hover{filter:brightness(1.07);}
  .btn-primary:disabled{opacity:.55; cursor:not-allowed; transform:none;}
  .btn-gold{background:var(--gold); color:#1a1200;}
  .btn-gold:hover{filter:brightness(1.05);}
  .btn-ghost{background:var(--bg-2); color:var(--text-0); border:1.5px solid var(--line);}
  .btn-ghost:hover{background:var(--bg-2-hover);}
  .btn-sm{padding:10px 14px; font-size:13px; width:auto;}

  .field-label{font-size:12px; font-weight:700; color:var(--text-2); text-transform:uppercase; letter-spacing:.08em; margin:0 2px 8px;}
  .hint{font-size:13px; color:var(--text-2); margin-top:10px; text-align:center; line-height:1.5;}
  .err-msg{font-size:13px; color:var(--danger); margin-top:8px; min-height:16px;}

  .spinner{width:18px;height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; animation: spin .7s linear infinite; flex-shrink:0;}
  .spinner.dark{border-color:rgba(255,255,255,.15); border-top-color:var(--text-1);}
  @keyframes spin{ to{ transform:rotate(360deg);} }
  #screen-loading{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;}
  #screen-loading .spinner{width:28px; height:28px; border-width:3px;}
  #screen-loading p{color:var(--text-2); font-size:13px;}

  #screen-email{flex:1; display:flex; flex-direction:column; justify-content:center; gap:26px; padding-bottom:60px;}
  .hero-mark{width:64px;height:64px;border-radius:20px; background:var(--brand-grad); display:flex;align-items:center;justify-content:center;
    box-shadow:0 20px 50px -16px rgba(255,61,138,.5); margin-bottom:2px; animation: markPulse 3.5s ease-in-out infinite;}
  @keyframes markPulse{0%,100%{box-shadow:0 20px 50px -16px rgba(138,77,255,.45);} 50%{box-shadow:0 20px 55px -10px rgba(255,61,138,.55);}}
  .hero-mark svg{width:30px;height:30px;}
  h1.title{font-size:28px; font-weight:800; margin:0 0 6px; letter-spacing:-.5px;}
  p.subtitle{font-size:15px; color:var(--text-1); margin:0; line-height:1.5;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 2px 6px;}
  .avatar{width:36px;height:36px;border-radius:50%; background:var(--bg-2); border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center; font-weight:700; font-size:13px; color:var(--text-1);}
  .logout-btn{background:var(--bg-2); border:1.5px solid var(--line); color:var(--text-1); border-radius:12px; width:36px;height:36px;
    display:flex;align-items:center;justify-content:center; cursor:pointer; transition:background .2s, color .2s;}
  .logout-btn:hover{background:var(--bg-2-hover); color:var(--text-0);}

  .level-pill{display:inline-flex; align-items:center; gap:6px; background:var(--bg-2); border:1px solid var(--line);
    border-radius:999px; padding:5px 10px 5px 6px; font-size:12px; font-weight:800; color:var(--text-1);}
  .level-pill .lv-badge{width:18px;height:18px;border-radius:50%; background:var(--brand-grad); display:flex;align-items:center;justify-content:center; color:#fff; font-size:10px;}
  .vip-pill{display:inline-flex; align-items:center; gap:6px; background:var(--gold); border-radius:999px; padding:5px 12px; font-size:11.5px; font-weight:800; color:#1a1200; letter-spacing:.03em;}

  .balance-block{padding:18px 2px 6px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .balance-label{font-size:13px; color:var(--text-2); font-weight:700; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;}
  .balance-amount{font-size:38px; font-weight:800; letter-spacing:-1px; display:flex; align-items:baseline; gap:6px;}
  .balance-amount .cur{font-size:22px; color:var(--text-1); font-weight:700;}

  .card-visual{position:relative; margin-top:16px; border-radius:var(--radius-l); padding:22px 22px 20px;
    background: radial-gradient(130% 100% at 100% 0%, rgba(255,61,138,.16), transparent 55%), radial-gradient(130% 100% at 0% 100%, rgba(138,77,255,.20), transparent 55%), #08080a;
    border:1px solid rgba(255,255,255,.06); overflow:hidden; box-shadow:var(--shadow-card); min-height:150px;
    display:flex; flex-direction:column; justify-content:space-between;}
  .card-visual::after{content:""; position:absolute; inset:0; background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.08) 48%, transparent 60%); transform:translateX(-120%); animation: sheen 2.6s ease-in-out .4s 1;}
  @keyframes sheen{ to{transform:translateX(120%);} }
  .card-top-row{display:flex; justify-content:space-between; align-items:center;}
  .chip{width:36px;height:26px;border-radius:6px; background:var(--gold); position:relative;}
  .chip::before{content:""; position:absolute; inset:4px; border:1px solid rgba(0,0,0,.25); border-radius:3px;}
  .card-brand-mark{font-weight:800; font-size:15px; letter-spacing:.3px; color:#fff; font-style:italic; opacity:.92;}
  .card-number-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px;}
  .card-number{font-size:18px; letter-spacing:1.5px; color:#fff; font-weight:600;}
  .copy-btn{background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.14); color:#fff; border-radius:10px; padding:8px 10px; font-size:12px; font-weight:700;
    display:flex; align-items:center; gap:6px; cursor:pointer; transition:background .2s ease, transform .15s ease; white-space:nowrap;}
  .copy-btn:hover{background:rgba(255,255,255,.18);}
  .copy-btn:active{transform:scale(.94);}
  .copy-btn svg{width:13px;height:13px;}
  .card-bottom-row{margin-top:12px;}
  .card-holder{font-size:11.5px; color:rgba(255,255,255,.6); text-transform:uppercase; letter-spacing:.07em;}

  .actions-row{display:flex; gap:16px; margin-top:22px; padding:0 2px; flex-wrap:wrap;}
  .action-btn{display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; color:var(--text-0); background:none; border:none; padding:0;
    transition:transform .15s ease, opacity .15s ease; width:64px;}
  .action-btn:active{transform:scale(.93);}
  .action-btn .icon-wrap{width:54px;height:54px;border-radius:50%; background:var(--bg-2); border:1px solid var(--line); display:flex;align-items:center;justify-content:center; transition:background .2s ease;}
  .action-btn:hover .icon-wrap{background:var(--bg-2-hover);}
  .action-btn .icon-wrap svg{width:20px;height:20px;}
  .action-btn span{font-size:11.5px; font-weight:600; color:var(--text-1); text-align:center;}

  /* loan / vip cards */
  .info-card{margin-top:22px; padding:16px; background:var(--bg-1); border:1px solid var(--line); border-radius:18px;}
  .info-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .info-card-title{font-size:13.5px; font-weight:800;}
  .info-card-sub{font-size:12.5px; color:var(--text-2); margin-top:2px; line-height:1.5;}
  .timer-row{display:flex; align-items:center; justify-content:space-between; margin-top:12px; gap:10px;}
  .timer{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:var(--warn);}
  .timer.danger{color:var(--danger);}
  .progress-track{height:6px; border-radius:4px; background:var(--bg-2); overflow:hidden; margin-top:10px;}
  .progress-fill{height:100%; background:var(--brand-grad); border-radius:4px; transition:width .3s ease;}
  .progress-fill.danger{background:var(--red);}

  .sync-note{display:flex; align-items:center; gap:8px; margin-top:22px; padding:11px 14px; background:var(--bg-1); border:1px solid var(--line); border-radius:14px; font-size:12px; color:var(--text-2); line-height:1.4;}
  .sync-note svg{width:15px;height:15px; flex-shrink:0; color:var(--text-2);}

  .section-label{font-size:13px; font-weight:800; color:var(--text-1); text-transform:uppercase; letter-spacing:.08em; margin:26px 2px 12px; display:flex; align-items:center; justify-content:space-between;}
  .tx-list{display:flex; flex-direction:column; gap:2px; padding-bottom:10px;}
  .tx-item{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .15s ease; border-radius:10px;}
  .tx-item:hover{background:var(--bg-1);}
  .tx-item:last-child{border-bottom:none;}
  .tx-icon{width:38px;height:38px;border-radius:50%; flex-shrink:0; display:flex;align-items:center;justify-content:center; background:var(--bg-2);}
  .tx-icon.topup{background:var(--brand-grad);}
  .tx-icon.gold{background:var(--gold);}
  .tx-icon svg{width:16px;height:16px;}
  .tx-info{flex:1; min-width:0;}
  .tx-title{font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tx-date{font-size:12px; color:var(--text-2); margin-top:2px;}
  .tx-right{display:flex; align-items:center; gap:8px;}
  .tx-amount{font-size:14px; font-weight:700; white-space:nowrap;}
  .tx-amount.pos{color:var(--success);}
  .tx-amount.neg{color:var(--text-0);}
  .receipt-chip{width:26px;height:26px;border-radius:50%; background:var(--bg-2); border:1px solid var(--line); display:flex;align-items:center;justify-content:center; color:var(--text-2); flex-shrink:0;}
  .receipt-chip svg{width:12px;height:12px;}
  .empty-tx{text-align:center; color:var(--text-2); font-size:13px; padding:34px 10px;}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.65); backdrop-filter:blur(6px); display:flex; align-items:flex-end; justify-content:center; z-index:50; animation: fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .modal{width:100%; max-width:440px; background:var(--bg-1); border:1px solid var(--line); border-radius:26px 26px 0 0; padding:14px 20px 28px; max-height:88vh; overflow-y:auto; animation: modalUp .35s cubic-bezier(.19,1,.22,1);}
  @keyframes modalUp{ from{transform:translateY(100%);} to{transform:translateY(0);} }
  .modal-handle{width:38px;height:4px;border-radius:2px; background:var(--line); margin:6px auto 18px;}
  .modal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .modal-header h2{font-size:19px; margin:0; font-weight:800;}
  .close-x{width:32px;height:32px;border-radius:50%; background:var(--bg-2); border:none; color:var(--text-1); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; line-height:1;}
  .close-x:hover{background:var(--bg-2-hover); color:var(--text-0);}
  .field{margin-bottom:16px;}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .amount-chip{background:var(--bg-2); border:1px solid var(--line); color:var(--text-0); border-radius:10px; padding:8px 12px; font-size:13px; font-weight:700; cursor:pointer;}
  .amount-chip:hover{background:var(--bg-2-hover);}
  .amount-chip.active{border-color:#8a4dff; background:rgba(138,77,255,.12);}

  .receipt-hero{display:flex; flex-direction:column; align-items:center; gap:12px; padding:6px 0 20px;}
  .receipt-avatar{width:60px;height:60px;border-radius:50%; display:flex;align-items:center;justify-content:center; position:relative;}
  .receipt-avatar.out{background:var(--bg-2); border:1px solid var(--line);}
  .receipt-avatar.in{background:rgba(48,209,88,.14); border:1px solid rgba(48,209,88,.3);}
  .receipt-avatar.topup{background:var(--brand-grad);}
  .receipt-avatar.gold{background:var(--gold);}
  .receipt-avatar svg{width:24px;height:24px;}
  .receipt-status{font-size:16px; font-weight:800;}
  .receipt-sub{font-size:13px; color:var(--text-2);}
  .receipt-rows{border-top:1px solid var(--line); padding-top:6px;}
  .receipt-row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 2px; border-bottom:1px solid var(--line);}
  .receipt-row:last-child{border-bottom:none;}
  .receipt-row .k{font-size:13.5px; color:var(--text-2);}
  .receipt-row .v{font-size:13.5px; font-weight:700; color:var(--text-0); text-align:right;}
  .receipt-row .v.num{font-family:'JetBrains Mono',monospace; letter-spacing:.5px; font-size:13px;}
  .badge-ok{display:inline-flex; align-items:center; gap:4px; color:var(--success); font-weight:700;}
  .badge-ok svg{width:13px;height:13px;}

  #toast-container{position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:10px; width:100%; max-width:400px; padding:0 20px; pointer-events:none;}
  .toast{background:var(--bg-2); border:1px solid var(--line); border-left:3px solid var(--success); color:var(--text-0); padding:14px 16px; border-radius:14px; font-size:14px; font-weight:600; box-shadow:0 12px 30px -8px rgba(0,0,0,.6); animation: toastIn .35s cubic-bezier(.19,1,.22,1), toastOut .3s ease 2.7s forwards;}
  .toast.error{border-left-color:var(--danger);}
  .toast.gold{border-left-color:#c9a961;}
  @keyframes toastIn{from{opacity:0; transform:translateY(-16px);} to{opacity:1; transform:translateY(0);}}
  @keyframes toastOut{to{opacity:0; transform:translateY(-10px);}}

  /* tab bar */
  .tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:440px; background:rgba(13,13,15,.92); backdrop-filter:blur(14px); border-top:1px solid var(--line); display:flex; z-index:40; padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
  .tab-btn{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 2px; cursor:pointer; color:var(--text-2); transition:color .2s ease;}
  .tab-btn.active{color:var(--text-0);}
  .tab-btn svg{width:20px;height:20px;}
  .tab-btn span{font-size:10.5px; font-weight:700;}

  /* market */
  .market-tabs{display:flex; gap:8px; margin:16px 0 4px;}
  .mtab{flex:1; text-align:center; padding:10px; border-radius:12px; background:var(--bg-2); border:1px solid var(--line); font-size:12.5px; font-weight:700; color:var(--text-1); cursor:pointer;}
  .mtab.active{background:var(--brand-grad); color:#fff; border-color:transparent;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; padding-bottom:20px;}
  .prod-card{background:var(--bg-1); border:1px solid var(--line); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:8px;}
  .prod-emoji{font-size:30px; text-align:center; padding:10px 0; background:var(--bg-2); border-radius:12px;}
  .prod-name{font-size:12.5px; font-weight:700; line-height:1.3; min-height:32px;}
  .prod-seller{font-size:10.5px; color:var(--text-2);}
  .prod-price{font-size:14px; font-weight:800; font-family:'JetBrains Mono',monospace;}
  .prod-buy{background:var(--bg-2); border:1px solid var(--line); color:var(--text-0); border-radius:10px; padding:8px; font-size:12px; font-weight:700; cursor:pointer;}
  .prod-buy:hover{background:var(--bg-2-hover);}
  .prod-buy:disabled{opacity:.4;}
  .empty-state{text-align:center; color:var(--text-2); font-size:13px; padding:40px 14px; grid-column:1/-1;}
  .my-listing{display:flex; align-items:center; gap:10px; background:var(--bg-1); border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:8px;}
  .my-listing .info{flex:1;}
  .my-listing .title{font-size:13px; font-weight:700;}
  .my-listing .price{font-size:12px; color:var(--text-2); font-family:'JetBrains Mono',monospace;}
  .del-btn{background:none; border:none; color:var(--danger); font-size:18px; cursor:pointer; padding:4px 8px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-container"></div>

<script>
(function(){
  "use strict";

  var SESSION_KEY = "nova_play_current_v1";
  var ADMIN_EMAIL = "netuimeni045@gmail.com";
  var APP_NAME = "NOVA PLAY";
  var CUR = "N₴"; // demo currency symbol, deliberately not a real-money symbol/name

  var STARTING_BALANCE = 1000;
  var LOAN_TERM_MS = 3 * 24 * 60 * 60 * 1000; // 3 days
  var VIP_COST = 500000;
  var VIP_DAILY_PAYOUT = 10000;
  var VIP_PERIOD_MS = 24 * 60 * 60 * 1000;
  var MEGA_VIP_COST = 2000000;
  var MEGA_VIP_LEVEL_BONUS = 20;
  var MEGA_VIP_DAILY_PAYOUT = 100000;
  var SAVINGS_DAILY_RATE = 0.20; // +20% per day, compounded
  var LOAN_LEVEL_LIMITS = [0, 500, 1000, 1800, 2800, 4000, 5000]; // index = level tier, capped at 5000
  var MAX_LOAN_CAP = 5000;

  // ---------- XP / leveling ----------
  // Every meaningful action grants XP so the level visibly progresses from
  // loans, transfers, purchases and sales alike (not just loan repayments).
  var XP_PER_LEVEL = 300;
  var XP_REWARDS = {
    loan_repay: 250,
    purchase: 15,
    sale: 20,
    transfer_out: 10,
    transfer_in: 10
  };
  function levelFromXp(xp){ return 1 + Math.floor((xp || 0) / XP_PER_LEVEL); }
  function addXp(user, kind){
    var amt = XP_REWARDS[kind] || 0;
    if(amt <= 0) return;
    user.xp = (user.xp || 0) + amt;
    var newLevel = levelFromXp(user.xp) + (user.megaLevelBonus || 0);
    if(newLevel > user.level) user.level = newLevel;
  }
  function loanTierForLevel(level){
    // credit tier only follows "earned" level (xp-based), mega bonus levels
    // don't unlock bigger loans by themselves
    var baseLevel = Math.max(1, level - (0)); // kept simple: tier follows full level
    var idx = Math.min(baseLevel, LOAN_LEVEL_LIMITS.length - 1);
    return idx;
  }
  function maxLoanForLevel(level){
    var idx = loanTierForLevel(level);
    return Math.min(LOAN_LEVEL_LIMITS[idx], MAX_LOAN_CAP);
  }

  // ================= Firebase Firestore storage =================

  // settings → Your apps → SDK setup and configuration → Config).

        if(snap.exists) return normalizeUser(snap.data());
        return null;
      }catch(e){ /* fall through to local */ }
    }
    var raw = localFallbackGet("user:" + email);
    if(!raw) return null;
    try{ return normalizeUser(JSON.parse(raw)); }catch(e){ return null; }
  }
  function normalizeUser(user){

    if(user.loanRepaid === undefined) user.loanRepaid = 0;

  async function generateUniqueCard(){
    var digits, taken, attempts = 0;
    do{
      digits = "5375";
      for(var i=0;i<12;i++){ digits += Math.floor(Math.random()*10); }
      var owner = await getCardOwnerEmail(digits);
      taken = !!owner;
      attempts++;
    } while(taken && attempts < 25);
    return digits;
  }

  async function getAllListings(retryOnEmpty){
    if(firebaseReady){
      try{
        var qs = await db.collection("listings").orderBy("createdAt", "desc").get();
        var out = [];
        qs.forEach(function(doc){ out.push(doc.data()); });
        if(out.length === 0 && retryOnEmpty){
          await wait(500);
          var qs2 = await db.collection("listings").orderBy("createdAt", "desc").get();
          qs2.forEach(function(doc){ out.push(doc.data()); });
        }
        return out;
      }catch(e){ /* fall through to local */ }
    }
    // local-only fallback: scan localStorage keys with the listing: prefix
    var out2 = [];
    try{
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf(LOCAL_PREFIX + "listing:") === 0){
          try{ out2.push(JSON.parse(localStorage.getItem(k))); }catch(e){}
        }
      }
    }catch(e){}
    return out2.sort(function(a,b){ return b.createdAt - a.createdAt; });
  }

  function formatMoney(n){
    n = Math.round(n * 100) / 100;
    var neg = n < 0; n = Math.abs(n);
    var parts = n.toFixed(2).split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (neg ? "-" : "") + parts[0] + "," + parts[1];

  function formatDate(ts){
    var d = new Date(ts);
    var day = String(d.getDate()).padStart(2,"0");
    var monthNames = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
    var hh = String(d.getHours()).padStart(2,"0");
    var mm = String(d.getMinutes()).padStart(2,"0");
    return day + " " + monthNames[d.getMonth()] + " · " + hh + ":" + mm;
  }
  function formatDuration(ms){
    if(ms <= 0) return "00:00:00";
    var s = Math.floor(ms/1000);
    var d = Math.floor(s / 86400); s -= d*86400;
    var h = Math.floor(s / 3600); s -= h*3600;
    var m = Math.floor(s / 60); s -= m*60;
    if(d > 0) return d + "д " + String(h).padStart(2,"0") + "г " + String(m).padStart(2,"0") + "хв";
    return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  }

          email: email,

          balance: STARTING_BALANCE,
          transactions: [{id:uid(), kind:"bonus", amount: STARTING_BALANCE, date: Date.now(), purpose:"Стартовий бонус гри"}],
          createdAt: Date.now()
        });
        await saveUser(user);
        await reserveCard(cardDigits, email);
      }catch(e){
        showToast("Не вдалося створити профіль. Спробуйте ще раз", "error"); render(); return;
      }
      showToast("Профіль створено! +" + formatMoney(STARTING_BALANCE) + " " + CUR + " стартового бонусу");
    } else {
      showToast("З поверненням!");

    setSession(email);
    state.email = email; state.user = user; state.screen = "home"; state.tab = "home";
    render();
    startTimers();
  }

  function updateLiveTimers(){
    var u = state.user; if(!u) return;
    var loanEl = document.getElementById("loan-timer-val");
    if(loanEl && u.loan){
      var remain = u.loan.dueAt - Date.now();
      loanEl.textContent = formatDuration(remain);
      loanEl.className = "timer" + (remain < 6*60*60*1000 ? " danger" : "");
      var fill = document.getElementById("loan-progress-fill");
      if(fill){
        var total = u.loan.dueAt - u.loan.takenAt;
        var pct = Math.max(0, Math.min(100, (remain/total)*100));
        fill.style.width = pct + "%";
        fill.className = "progress-fill" + (pct < 20 ? " danger" : "");
      }
    }

  async function checkLoanAndVip(){
    if(!state.email) return;
    var user = await getUser(state.email);
    if(!user) return;
    var changed = false;
    var now = Date.now();

    if(user.loan && now >= user.loan.dueAt){
      var amt = user.loan.amount;
      user.balance = Math.round((user.balance - amt) * 100) / 100; // auto-deduct; can go negative (debt)
      user.transactions.push({id:uid(), kind:"loan_auto", amount:-amt, date: now, purpose:"Автосписання за прострочений кредит"});
      user.loan = null;
      changed = true;
      if(state.email){ showToast("Кредит не сплачено вчасно — " + formatMoney(amt) + " " + CUR + " списано автоматично", "error"); }
    }

    if(user.vip || user.mega){
      var last = user.vipLastPayout || user.vipSince || user.megaSince || now;
      if(now - last >= VIP_PERIOD_MS){
        var cycles = Math.floor((now - last) / VIP_PERIOD_MS);
        cycles = Math.min(cycles, 30); // safety cap for demo
        var dailyAmt = user.mega ? MEGA_VIP_DAILY_PAYOUT : VIP_DAILY_PAYOUT;
        var payout = cycles * dailyAmt;
        user.balance = Math.round((user.balance + payout) * 100) / 100;
        user.vipLastPayout = last + cycles * VIP_PERIOD_MS;
        user.transactions.push({id:uid(), kind:"vip_payout", amount: payout, date: now, purpose:(user.mega ? "Мега VIP" : "VIP") + " щоденна виплата (" + cycles + "x)"});
        changed = true;
        showToast((user.mega ? "Мега VIP" : "VIP") + "-виплата: +" + formatMoney(payout) + " " + CUR, "gold");
      }
    }

    if(user.savings && user.savings.balance > 0){
      var lastS = user.savings.lastGrowthAt || now;
      if(now - lastS >= VIP_PERIOD_MS){
        var cyclesS = Math.floor((now - lastS) / VIP_PERIOD_MS);
        cyclesS = Math.min(cyclesS, 30); // safety cap for demo
        var before = user.savings.balance;
        var grown = before * Math.pow(1 + SAVINGS_DAILY_RATE, cyclesS);
        grown = Math.round(grown * 100) / 100;
        var gain = Math.round((grown - before) * 100) / 100;
        user.savings.balance = grown;
        user.savings.lastGrowthAt = lastS + cyclesS * VIP_PERIOD_MS;
        user.transactions.push({id:uid(), kind:"savings_growth", amount: gain, date: now, purpose:"Нарахування на зберігальному рахунку (" + cyclesS + "x, +20%/день)"});
        changed = true;
        showToast("Зберігальний рахунок: +" + formatMoney(gain) + " " + CUR, "gold");
      }
    }

    if(changed){
      await saveUser(user);
      if(state.email === user.email){ state.user = user; render(); }
    }
  }

  function animateBalance(el, target){
    var start = 0, duration = 700, startTime = null;
    function step(ts){
      if(!startTime) startTime = ts;
      var progress = Math.min((ts - startTime) / duration, 1);
      var eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = formatMoney(start + (target - start) * eased);
      if(progress < 1) requestAnimationFrame(step); else el.textContent = formatMoney(target);
    }
    requestAnimationFrame(step);
  }

  function copyCardNumber(card, btn, label){
    var text = card.replace(/\s/g,"");
    function done(){
      var original = label.textContent;
      btn.innerHTML = ICONS.check + '<span>Скопійовано</span>';
      showToast("Номер картки скопійовано");
      setTimeout(function(){ btn.innerHTML = ICONS.copy + '<span>' + original + '</span>'; }, 1600);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  }
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
  }

  async function repayLoan(){
    var user = await getUser(state.email);
    if(!user || !user.loan){ showToast("Активного кредиту немає", "error"); return; }
    if(user.balance < user.loan.amount){
      showToast("Недостатньо коштів для дострокового погашення", "error"); return;
    }
    var amt = user.loan.amount;
    user.balance = Math.round((user.balance - amt) * 100) / 100;
    user.transactions.push({id:uid(), kind:"loan_repay", amount:-amt, date: Date.now(), purpose:"Дострокове погашення"});
    user.loanRepaid = (user.loanRepaid || 0) + 1;
    var levelBefore = user.level;
    addXp(user, "loan_repay");
    if(user.level > levelBefore){

    user.loan = null;
    await saveUser(user);
    state.user = user;
    render();
    showToast("Кредит погашено");

  function renderLoanModal(){
    var user = state.user;
    var maxLoan = maxLoanForLevel(user.level);
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    var modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML =
      '<div class="modal-handle"></div>' +

      '<div class="field"><div class="field-label">Сума кредиту</div>' +
      '<input type="number" id="loan-amount" placeholder="0" inputmode="decimal" min="1" max="' + maxLoan + '" step="1">' +
      '<div class="chip-row" id="loan-chips"></div></div>' +
      '<div class="err-msg" id="loan-error"></div>' +
      '<button class="btn btn-primary" id="loan-submit"><span id="loan-submit-label">Отримати кредит</span></button>';
    overlay.appendChild(modal);

    var chipsRow = modal.querySelector("#loan-chips");
    var options = [Math.round(maxLoan*0.25), Math.round(maxLoan*0.5), Math.round(maxLoan*0.75), maxLoan].filter(function(v,i,a){ return v>0 && a.indexOf(v)===i; });
    var input = modal.querySelector("#loan-amount");
    options.forEach(function(v){
      var chip = document.createElement("div");
      chip.className = "amount-chip";
      chip.textContent = formatMoney(v) + " " + CUR;
      chip.addEventListener("click", function(){ input.value = v; });
      chipsRow.appendChild(chip);
    });

    var errEl = modal.querySelector("#loan-error");
    var submitBtn = modal.querySelector("#loan-submit");
    var submitLabel = modal.querySelector("#loan-submit-label");

    overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
    modal.querySelector("#modal-close").addEventListener("click", closeModal);
    input.addEventListener("input", function(){ errEl.textContent = ""; });

    submitBtn.addEventListener("click", async function(){
      var amount = parseFloat(input.value);
      if(!amount || amount <= 0){ errEl.textContent = "Введіть суму кредиту"; return; }

      submitBtn.disabled = true; input.disabled = true;
      submitLabel.innerHTML = '<span class="spinner"></span>';

      var user2 = await getUser(state.email);
      if(!user2){ showToast("Помилка синхронізації", "error"); closeModal(); return; }

      // Re-check against the freshest known level/limit, not a stale value
      // captured when the modal first opened.
      var freshMax = maxLoanForLevel(user2.level);
      if(amount > freshMax + 0.005){
        errEl.textContent = "Максимум для вашого рівня (" + user2.level + "): " + formatMoney(freshMax) + " " + CUR;
        submitBtn.disabled=false; input.disabled=false; submitLabel.textContent="Отримати кредит"; return;
      }
      if(user2.loan){ errEl.textContent = "У вас вже є активний кредит"; submitBtn.disabled=false; input.disabled=false; submitLabel.textContent="Отримати кредит"; return; }

      var now = Date.now();
      user2.loan = {amount: amount, takenAt: now, dueAt: now + LOAN_TERM_MS};
      user2.balance = Math.round((user2.balance + amount) * 100) / 100;
      user2.transactions.push({id:uid(), kind:"loan_take", amount: amount, date: now, purpose:"Кредит на 3 дні"});

      var ok = await saveUser(user2);
      if(!ok){ showToast("Не вдалося оформити кредит", "error"); submitBtn.disabled=false; input.disabled=false; submitLabel.textContent="Отримати кредит"; return; }

      state.user = user2;
      closeModal();
      showToast("Кредит " + formatMoney(amount) + " " + CUR + " зараховано. Погасіть протягом 3 днів");
    });

    setTimeout(function(){ input.focus(); }, 300);
    return overlay;
  }

      var amount = parseFloat(amountInput.value);
      if(!amount || amount <= 0){ errEl.textContent = "Введіть суму"; return; }

      submitBtn.disabled = true; amountInput.disabled = true; submitLabel.innerHTML = '<span class="spinner"></span>';
      var fresh = await getUser(state.email);
      if(!fresh){ showToast("Помилка синхронізації", "error"); closeModal(); return; }
      if(!fresh.savings) fresh.savings = {balance:0, lastGrowthAt:null};

      var now = Date.now();
      if(mode === "deposit"){
        if(fresh.balance < amount){ errEl.textContent = "Недостатньо коштів на балансі"; submitBtn.disabled=false; amountInput.disabled=false; submitLabel.textContent="Покласти на рахунок"; return; }
        fresh.balance = Math.round((fresh.balance - amount) * 100) / 100;
        fresh.savings.balance = Math.round((fresh.savings.balance + amount) * 100) / 100;
        if(!fresh.savings.lastGrowthAt) fresh.savings.lastGrowthAt = now;
        fresh.transactions.push({id:uid(), kind:"savings_deposit", amount:-amount, date: now, purpose:"Поповнення зберігального рахунку"});

        if(fresh.savings.balance < amount){ errEl.textContent = "Недостатньо коштів на зберігальному рахунку"; submitBtn.disabled=false; amountInput.disabled=false; submitLabel.textContent="Зняти на баланс"; return; }
        fresh.savings.balance = Math.round((fresh.savings.balance - amount) * 100) / 100;
        fresh.balance = Math.round((fresh.balance + amount) * 100) / 100;
        fresh.transactions.push({id:uid(), kind:"savings_withdraw", amount: amount, date: now, purpose:"Зняття зі зберігального рахунку"});
      }

      var ok = await saveUser(fresh);
      if(!ok){ showToast("Не вдалося виконати операцію", "error"); submitBtn.disabled=false; amountInput.disabled=false; submitLabel.textContent = mode==="deposit"?"Покласти на рахунок":"Зняти на баланс"; return; }

      showToast(mode === "deposit" ? "Кошти покладено на рахунок" : "Кошти знято на баланс");
    });

    setTimeout(function(){ amountInput.focus(); }, 300);
    return overlay;
  }

  async function loadMarketContent(container){
    container.innerHTML = '<div class="empty-state" style="padding:30px 10px;"><span class="spinner dark" style="display:inline-block;"></span></div>';
    if(state.marketTab === "catalog"){
      var grid = document.createElement("div");
      grid.className = "grid";
      CATALOG.forEach(function(p){
        grid.appendChild(productCardEl({
          name: p.name, price: p.price, emoji: p.emoji, sellerLabel: "NOVA Маркет",
          onBuy: function(qty){ buyCatalogItem(p, qty); }
        }));
      });
      container.innerHTML = ""; container.appendChild(grid);
      return;
    }

    var all = await getAllListings(state.marketTab === "mine");
    if(state.marketTab === "community"){
      var mine = state.email;
      var others = all.filter(function(l){ return l.sellerEmail !== mine; });
      container.innerHTML = "";
      var grid2 = document.createElement("div");
      grid2.className = "grid";
      if(others.length === 0){
        grid2.innerHTML = '<div class="empty-state">Поки що немає оголошень від інших гравців</div>';
      } else {
        others.forEach(function(l){
          grid2.appendChild(productCardEl({
            name: l.title, price: l.price, emoji: "📦", sellerLabel: l.sellerEmail.split("@")[0],
            onBuy: function(qty){ buyListing(l, qty); }
          }));
        });
      }
      container.appendChild(grid2);
    } else if(state.marketTab === "mine"){
      var myListings = all.filter(function(l){ return l.sellerEmail === state.email; });
      container.innerHTML = "";
      if(myListings.length === 0){
        container.innerHTML = '<div class="empty-state">У вас ще немає оголошень. Натисніть «+ Продати», щоб виставити товар.</div>';
      } else {
        myListings.forEach(function(l){
          var row = document.createElement("div");
          row.className = "my-listing";
          row.innerHTML = '<div class="info"><div class="title">' + escapeHtml(l.title) + '</div><div class="price">' + formatMoney(l.price) + ' ' + CUR + '</div></div>' +
            '<button class="del-btn" title="Видалити">&times;</button>';
          row.querySelector(".del-btn").addEventListener("click", async function(){
            await deleteListing(l.id);
            showToast("Оголошення видалено");
            render();
          });
          container.appendChild(row);
        });
      }
    }
  }

  function productCardEl(opts){
    var qty = 1;

        '<button class="prod-buy" id="qty-plus" style="width:30px; padding:8px 0;">+</button>' +
      '</div>' +
      '<button class="prod-buy" id="prod-buy-btn">Купити</button>';

    var totalEl = card.querySelector("#prod-total");
    var qtyEl = card.querySelector("#qty-val");
    function refreshTotal(){
      qtyEl.textContent = String(qty);
      totalEl.textContent = formatMoney(opts.price * qty) + " " + CUR;
    }
    card.querySelector("#qty-minus").addEventListener("click", function(){ if(qty>1){ qty--; refreshTotal(); } });
    card.querySelector("#qty-plus").addEventListener("click", function(){ if(qty<99){ qty++; refreshTotal(); } });
    card.querySelector("#prod-buy-btn").addEventListener("click", function(){ opts.onBuy(qty); });
    return card;
  }

  async function buyCatalogItem(product, qty){
    qty = Math.max(1, Math.round(qty || 1));
    var total = Math.round(product.price * qty * 100) / 100;
    var user = await getUser(state.email);
    if(!user){ showToast("Помилка синхронізації", "error"); return; }
    if(user.balance < total){ showToast("Недостатньо коштів", "error"); return; }
    user.balance = Math.round((user.balance - total) * 100) / 100;
    var label = qty > 1 ? (product.name + " ×" + qty) : product.name;
    user.transactions.push({id:uid(), kind:"purchase", amount:-total, date: Date.now(), purpose: label});
    addXp(user, "purchase");
    var ok = await saveUser(user);
    if(!ok){ showToast("Не вдалося купити товар", "error"); return; }
    state.user = user;
    showToast("Куплено: " + label);
    render();
  }

  async function buyListing(listing, qty){
    qty = Math.max(1, Math.round(qty || 1));
    var total = Math.round(listing.price * qty * 100) / 100;
    var buyer = await getUser(state.email);
    if(!buyer){ showToast("Помилка синхронізації", "error"); return; }
    if(buyer.balance < total){ showToast("Недостатньо коштів", "error"); return; }

    var fresh = await getListing(listing.id);
    if(!fresh){ showToast("Оголошення вже недоступне", "error"); render(); return; }

    var seller = await getUser(listing.sellerEmail);
    if(!seller){ showToast("Продавця не знайдено", "error"); return; }

    var label = qty > 1 ? (listing.title + " ×" + qty) : listing.title;
    buyer.balance = Math.round((buyer.balance - total) * 100) / 100;
    seller.balance = Math.round((seller.balance + total) * 100) / 100;
    var now = Date.now();
    buyer.transactions.push({id:uid(), kind:"purchase", amount:-total, date: now, purpose: label + " (від " + seller.email.split("@")[0] + ")"});
    seller.transactions.push({id:uid(), kind:"sale", amount:total, date: now, purpose: label});
    addXp(buyer, "purchase");
    addXp(seller, "sale");

    await saveUser(buyer);
    await saveUser(seller);
    await deleteListing(listing.id);

    state.user = buyer;
    showToast("Куплено: " + listing.title);
    render();
  }

      '<div class="field"><div class="field-label">Сума</div>' +
      '<input type="number" id="tr-amount" placeholder="0" inputmode="decimal" min="0" step="0.01"></div>' +
      '<div class="err-msg" id="tr-error"></div>' +
      '<button class="btn btn-primary" id="tr-submit" style="margin-top:8px;"><span id="tr-submit-label">Переказати</span></button>';
    overlay.appendChild(modal);

    var cardInput = modal.querySelector("#tr-card");
    var amountInput = modal.querySelector("#tr-amount");
    var errEl = modal.querySelector("#tr-error");
    var submitBtn = modal.querySelector("#tr-submit");
    var submitLabel = modal.querySelector("#tr-submit-label");

    cardInput.addEventListener("input", function(){
      var digits = cardDigitsOnly(cardInput.value).slice(0,16);
      cardInput.value = digits.replace(/(.{4})/g,"$1 ").trim();
      errEl.textContent = ""; cardInput.classList.remove("error");
    });
    amountInput.addEventListener("input", function(){ errEl.textContent = ""; amountInput.classList.remove("error"); });

    overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
    modal.querySelector("#modal-close").addEventListener("click", closeModal);

    submitBtn.addEventListener("click", async function(){
      errEl.textContent = ""; cardInput.classList.remove("error"); amountInput.classList.remove("error");
      var cardDigits = cardDigitsOnly(cardInput.value);
      var amount = parseFloat(amountInput.value);

      if(cardDigits.length !== 16){ errEl.textContent = "Введіть коректний номер картки (16 цифр)"; cardInput.classList.add("error"); return; }
      if(!amount || amount <= 0){ errEl.textContent = "Введіть суму переказу"; amountInput.classList.add("error"); return; }
      if(cardDigits === state.user.card.replace(/\s/g,"")){ errEl.textContent = "Не можна переказати кошти самому собі"; return; }

      submitBtn.disabled = true; cardInput.disabled = true; amountInput.disabled = true;
      submitLabel.innerHTML = '<span class="spinner"></span>';

      var sender = await getUser(state.email);
      if(!sender){ showToast("Помилка синхронізації", "error"); closeModal(); return; }
      if(amount > sender.balance){
        errEl.textContent = "Недостатньо коштів";
        submitBtn.disabled=false; cardInput.disabled=false; amountInput.disabled=false; submitLabel.textContent="Переказати"; return;
      }
      var receiverEmail = await getCardOwnerEmail(cardDigits);
      if(!receiverEmail){
        errEl.textContent = "Картку не знайдено"; cardInput.classList.add("error");
        submitBtn.disabled=false; cardInput.disabled=false; amountInput.disabled=false; submitLabel.textContent="Переказати"; return;
      }
      var receiver = await getUser(receiverEmail);
      if(!receiver){
        errEl.textContent = "Картку не знайдено";
        submitBtn.disabled=false; cardInput.disabled=false; amountInput.disabled=false; submitLabel.textContent="Переказати"; return;
      }

      sender.balance = Math.round((sender.balance - amount) * 100) / 100;
      receiver.balance = Math.round((receiver.balance + amount) * 100) / 100;
      var now = Date.now();
      var senderCardDigits = sender.card.replace(/\s/g,"");
      var receiverCardDigits = receiver.card.replace(/\s/g,"");

      var txOut = {id: uid(), kind:"transfer_out", amount:-amount, date: now, senderCard: senderCardDigits, receiverCard: receiverCardDigits, purpose:"Переказ коштів"};
      var txIn = {id: uid(), kind:"transfer_in", amount: amount, date: now, senderCard: senderCardDigits, receiverCard: receiverCardDigits, purpose:"Переказ коштів"};
      sender.transactions.push(txOut);
      receiver.transactions.push(txIn);
      addXp(sender, "transfer_out");
      addXp(receiver, "transfer_in");

      var ok1 = await saveUser(sender);
      var ok2 = await saveUser(receiver);
      if(!ok1 || !ok2){
        showToast("Не вдалося виконати переказ", "error");
        submitBtn.disabled=false; cardInput.disabled=false; amountInput.disabled=false; submitLabel.textContent="Переказати"; return;
      }

      state.user = sender;
      state.modal = {type:"receipt", tx:txOut};
      render();
      showToast("Переказано " + formatMoney(amount) + " " + CUR);
    });

    setTimeout(function(){ cardInput.focus(); }, 300);
    return overlay;
  }

  // ---------- topup modal (admin only, demo currency) ----------
  function renderTopupModal(){
    if(state.email !== ADMIN_EMAIL){ state.modal = null; return document.createElement("div"); }
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    var modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML =
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>Поповнення (адмін, демо)</h2><button class="close-x" id="modal-close">&times;</button></div>' +
      '<div class="field"><div class="field-label">Сума поповнення</div>' +
      '<input type="number" id="tp-amount" placeholder="0" inputmode="decimal" min="0" step="0.01"></div>' +
      '<div class="err-msg" id="tp-error"></div>' +
      '<button class="btn btn-primary" id="tp-submit" style="margin-top:8px;"><span id="tp-submit-label">Поповнити</span></button>';
    overlay.appendChild(modal);

    var amountInput = modal.querySelector("#tp-amount");
    var errEl = modal.querySelector("#tp-error");
    var submitBtn = modal.querySelector("#tp-submit");
    var submitLabel = modal.querySelector("#tp-submit-label");

    overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
    modal.querySelector("#modal-close").addEventListener("click", closeModal);
    amountInput.addEventListener("input", function(){ errEl.textContent = ""; amountInput.classList.remove("error"); });

    submitBtn.addEventListener("click", async function(){
      var amount = parseFloat(amountInput.value);
      if(!amount || amount <= 0){ errEl.textContent = "Введіть суму поповнення"; amountInput.classList.add("error"); return; }
      submitBtn.disabled = true; amountInput.disabled = true;
      submitLabel.innerHTML = '<span class="spinner"></span>';

      var user = await getUser(state.email);
      if(!user){ showToast("Помилка синхронізації", "error"); closeModal(); return; }
      user.balance = Math.round((user.balance + amount) * 100) / 100;
      var tx = {id: uid(), kind:"topup", amount: amount, date: Date.now(), receiverCard: user.card.replace(/\s/g,""), purpose:"Демо-поповнення"};
      user.transactions.push(tx);

      var ok = await saveUser(user);
      if(!ok){ showToast("Не вдалося поповнити рахунок", "error"); submitBtn.disabled=false; amountInput.disabled=false; submitLabel.textContent="Поповнити"; return; }

      state.user = user;
      state.modal = {type:"receipt", tx:tx};
      render();
      showToast("Баланс поповнено на " + formatMoney(amount) + " " + CUR);
    });

    setTimeout(function(){ amountInput.focus(); }, 300);
    return overlay;
  }

  // ---------- receipt modal ----------
  function renderReceiptModal(tx){
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    var modal = document.createElement("div");
    modal.className = "modal";

    var isGoldKind = tx.kind === "vip_buy" || tx.kind === "vip_payout";
    var isTopup = tx.kind === "topup" || tx.kind === "bonus";
    var isOut = tx.amount < 0 && !isTopup;
    var avatarClass = isGoldKind ? "gold" : (isTopup ? "topup" : (isOut ? "out" : "in"));
    var avatarIcon = isGoldKind ? ICONS.crown : (isTopup ? ICONS.plus : (isOut ? ICONS.txOut : ICONS.txIn));
    var heading = tx.purpose || (tx.amount > 0 ? "Надходження" : "Списання");

    var rows = "";
    if(tx.senderCard) rows += receiptRow("Картка відправника", maskCard(tx.senderCard), true);
    if(tx.receiverCard) rows += receiptRow("Картка отримувача", maskCard(tx.receiverCard), true);
    if(tx.purpose) rows += receiptRow("Призначення", tx.purpose);
    rows += receiptRow("Сума операції", formatMoney(Math.abs(tx.amount)) + " " + CUR);
    rows += receiptRow("Комісія", "0,00 " + CUR);
    rows += '<div class="receipt-row"><div class="k">Статус</div><div class="v"><span class="badge-ok">' + ICONS.checkCircle + ' Виконано (демо)</span></div></div>';

    modal.innerHTML =
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>Квитанція</h2><button class="close-x" id="modal-close">&times;</button></div>' +
      '<div class="receipt-hero"><div class="receipt-avatar ' + avatarClass + '">' + avatarIcon + '</div>' +
      '<div class="receipt-status">' + escapeHtml(heading) + '</div>' +
      '<div class="receipt-sub">' + formatDate(tx.date) + '</div></div>' +
      '<div class="receipt-rows">' + rows + '</div>' +
      '<button class="btn btn-ghost" id="receipt-close-btn" style="margin-top:20px;">Готово</button>';

    overlay.appendChild(modal);
    overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
    modal.querySelector("#modal-close").addEventListener("click", closeModal);
    modal.querySelector("#receipt-close-btn").addEventListener("click", closeModal);
    return overlay;
  }

  function receiptRow(label, value, isNum){
    return '<div class="receipt-row"><div class="k">' + escapeHtml(label) + '</div><div class="v' + (isNum ? " num" : "") + '">' + escapeHtml(value) + '</div></div>';
  }

  // ---------- boot ----------
  async function boot(){
    state.screen = "loading";
    render();
    var savedEmail = getSession();
    if(savedEmail){
      var user = null;
      try{ user = await getUser(savedEmail); }catch(e){ user = null; }
      if(user){
        state.email = savedEmail; state.user = user; state.screen = "home";
        render();
        startTimers();
        return;
      } else {
        setSession(null); state.screen = "email";
      }
    } else {
      state.screen = "email";
    }
    render();
  }

  boot();
})();
</script>
</body>
</html>
