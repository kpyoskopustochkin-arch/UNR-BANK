<style>
  :root{
    --bg-0:#000000; --bg-1:#0d0d0f; --bg-2:#18181b; --bg-2-hover:#212124;
    --line:#26262a; --text-0:#f5f5f7; --text-1:#8e8e93; --text-2:#57575c;
    --brand-grad: linear-gradient(135deg,#8a4dff 0%,#ff3d8a 100%);
    --red: linear-gradient(180deg,#ff5470 0%,#ef2b4d 100%);
    --success:#30d158; --danger:#ff453a; --warn:#ffb020;
    --gold: linear-gradient(135deg,#f3dfa8,#c9a961);
    --radius-l:26px; --radius-m:18px; --radius-s:12px;
    --shadow-card: 0 24px 60px -22px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.03);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg-0); color:var(--text-0); font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif; display:flex; justify-content:center; min-height:100%;}
  .num{font-family:'JetBrains Mono',monospace;}
  #app{width:100%; max-width:440px; min-height:100vh; display:flex; flex-direction:column; position:relative; padding:0 20px 90px;}
  ::selection{background:#ff3d8a; color:#fff;}
  button{font-family:inherit;}

  /* demo banner */
  .demo-banner{
    position:sticky; top:0; z-index:60; margin:0 -20px; padding:9px 16px;
    background:repeating-linear-gradient(135deg,#3a2a00,#3a2a00 10px,#241a00 10px,#241a00 20px);
    border-bottom:1px solid #5a4200; color:#ffd873; font-size:11.5px; font-weight:800;
    text-align:center; letter-spacing:.03em;
  }

  .screen{display:flex; flex-direction:column; flex:1; animation: screenIn .45s cubic-bezier(.19,1,.22,1);}
  @keyframes screenIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand .mark{width:26px;height:26px;border-radius:8px; background:var(--brand-grad); display:flex;align-items:center;justify-content:center; flex-shrink:0; overflow:hidden;}
  .brand .mark svg{width:14px;height:14px;}
  .brand .mark img, .sidebar-brand .mark img{width:100%; height:100%; object-fit:cover;}
  .hero-mark img{width:100%; height:100%; object-fit:cover; border-radius:20px;}
  .hero-mark{overflow:hidden;}
  .brand span{font-weight:800; letter-spacing:.4px; font-size:15px; color:var(--text-0);}

  input, select{
    width:100%; background:var(--bg-2); border:1.5px solid var(--line); color:var(--text-0);
    border-radius:var(--radius-s); padding:16px 16px; font-size:16px; font-family:inherit; outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  input.num{font-family:'JetBrains Mono',monospace; letter-spacing:1px;}
  input::placeholder{color:var(--text-2);}
  input:focus, select:focus{border-color:#8a4dff; background:var(--bg-2-hover);}
  input.error{border-color:var(--danger);}
  input:disabled{opacity:.5;}

  .btn{border:none; border-radius:var(--radius-s); padding:16px 20px; font-size:16px; font-weight:700; cursor:pointer;
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .15s ease, filter .15s ease, opacity .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:hover{filter:brightness(1.07);}
  .btn-primary:disabled{opacity:.55; cursor:not-allowed; transform:none;}
  .btn-gold{background:var(--gold); color:#1a1200;}
  .btn-gold:hover{filter:brightness(1.05);}
  .btn-ghost{background:var(--bg-2); color:var(--text-0); border:1.5px solid var(--line);}
  .btn-ghost:hover{background:var(--bg-2-hover);}
  .btn-sm{padding:10px 14px; font-size:13px; width:auto;}

  .field-label{font-size:12px; font-weight:700; color:var(--text-2); text-transform:uppercase; letter-spacing:.08em; margin:0 2px 8px;}
  .hint{font-size:13px; color:var(--text-2); margin-top:10px; text-align:center; line-height:1.5;}
  .err-msg{font-size:13px; color:var(--danger); margin-top:8px; min-height:16px;}

  .spinner{width:18px;height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; animation: spin .7s linear infinite; flex-shrink:0;}
  .spinner.dark{border-color:rgba(255,255,255,.15); border-top-color:var(--text-1);}
  @keyframes spin{ to{ transform:rotate(360deg);} }
  #screen-loading{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;}
  #screen-loading .spinner{width:28px; height:28px; border-width:3px;}
  #screen-loading p{color:var(--text-2); font-size:13px;}

  #screen-email{flex:1; display:flex; flex-direction:column; justify-content:center; gap:26px; padding-bottom:60px;}
  .hero-mark{width:64px;height:64px;border-radius:20px; background:var(--brand-grad); display:flex;align-items:center;justify-content:center;
    box-shadow:0 20px 50px -16px rgba(255,61,138,.5); margin-bottom:2px; animation: markPulse 3.5s ease-in-out infinite;}
  @keyframes markPulse{0%,100%{box-shadow:0 20px 50px -16px rgba(138,77,255,.45);} 50%{box-shadow:0 20px 55px -10px rgba(255,61,138,.55);}}
  .hero-mark svg{width:30px;height:30px;}
  h1.title{font-size:28px; font-weight:800; margin:0 0 6px; letter-spacing:-.5px;}
  p.subtitle{font-size:15px; color:var(--text-1); margin:0; line-height:1.5;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 2px 6px;}
  .avatar{width:36px;height:36px;border-radius:50%; background:var(--bg-2); border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center; font-weight:700; font-size:13px; color:var(--text-1);}
  .logout-btn{background:var(--bg-2); border:1.5px solid var(--line); color:var(--text-1); border-radius:12px; width:36px;height:36px;
    display:flex;align-items:center;justify-content:center; cursor:pointer; transition:background .2s, color .2s;}
  .logout-btn:hover{background:var(--bg-2-hover); color:var(--text-0);}

  .level-pill{display:inline-flex; align-items:center; gap:6px; background:var(--bg-2); border:1px solid var(--line);
    border-radius:999px; padding:5px 10px 5px 6px; font-size:12px; font-weight:800; color:var(--text-1);}
  .level-pill .lv-badge{width:18px;height:18px;border-radius:50%; background:var(--brand-grad); display:flex;align-items:center;justify-content:center; color:#fff; font-size:10px;}
  .vip-pill{display:inline-flex; align-items:center; gap:6px; background:var(--gold); border-radius:999px; padding:5px 12px; font-size:11.5px; font-weight:800; color:#1a1200; letter-spacing:.03em;}

  .balance-block{padding:18px 2px 6px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .balance-label{font-size:13px; color:var(--text-2); font-weight:700; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;}
  .balance-amount{font-size:38px; font-weight:800; letter-spacing:-1px; display:flex; align-items:baseline; gap:6px;}
  .balance-amount .cur{font-size:22px; color:var(--text-1); font-weight:700;}

  .card-visual{position:relative; margin-top:16px; border-radius:var(--radius-l); padding:22px 22px 20px;
    background: radial-gradient(130% 100% at 100% 0%, rgba(255,61,138,.16), transparent 55%), radial-gradient(130% 100% at 0% 100%, rgba(138,77,255,.20), transparent 55%), #08080a;
    border:1px solid rgba(255,255,255,.06); overflow:hidden; box-shadow:var(--shadow-card); min-height:150px;
    display:flex; flex-direction:column; justify-content:space-between;}
  .card-visual::after{content:""; position:absolute; inset:0; background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.08) 48%, transparent 60%); transform:translateX(-120%); animation: sheen 2.6s ease-in-out .4s 1;}
  @keyframes sheen{ to{transform:translateX(120%);} }
  .card-visual.marshal-card{
    background:
      radial-gradient(140% 110% at 100% 0%, rgba(57,255,120,.28), transparent 55%),
      radial-gradient(140% 110% at 0% 100%, rgba(20,220,90,.28), transparent 55%),
      #041006;
    border:1px solid rgba(57,255,120,.55);
    box-shadow: 0 0 24px rgba(57,255,120,.4), 0 0 60px rgba(30,240,100,.2), var(--shadow-card);
    animation: neonPulse 2.4s ease-in-out infinite;
  }
  @keyframes neonPulse{
    0%,100%{ box-shadow: 0 0 20px rgba(57,255,120,.35), 0 0 50px rgba(30,240,100,.18), var(--shadow-card); }
    50%{ box-shadow: 0 0 36px rgba(57,255,120,.6), 0 0 84px rgba(30,240,100,.32), var(--shadow-card); }
  }
  .card-visual.marshal-card .card-brand-mark{
    color:#39ff78; text-shadow:0 0 10px rgba(57,255,120,.8); letter-spacing:1px;
  }
  .card-visual.marshal-card::after{
    background:linear-gradient(115deg, transparent 35%, rgba(57,255,120,.18) 48%, transparent 60%);
  }
  .card-visual.marshal-card.marshal-flash{
    animation: marshalFlash 1.6s ease-out 3;
  }
  @keyframes marshalFlash{
    0%{ box-shadow: 0 0 20px rgba(57,255,120,.35), 0 0 50px rgba(30,240,100,.18), var(--shadow-card); }
    30%{ box-shadow: 0 0 60px rgba(120,255,170,1), 0 0 140px rgba(57,255,120,.8), var(--shadow-card); }
    100%{ box-shadow: 0 0 20px rgba(57,255,120,.35), 0 0 50px rgba(30,240,100,.18), var(--shadow-card); }
  }
  .card-visual.admin-card{
    background:
      radial-gradient(140% 110% at 100% 0%, rgba(255,215,120,.25), transparent 55%),
      radial-gradient(140% 110% at 0% 100%, rgba(120,170,255,.22), transparent 55%),
      #0a0805;
    border:1px solid rgba(243,223,168,.5);
    box-shadow: 0 0 20px rgba(243,223,168,.25), var(--shadow-card);
  }
  .card-visual.admin-card .card-brand-mark{
    color:#f3dfa8; text-shadow:0 0 8px rgba(243,223,168,.6); letter-spacing:1px;
  }
  .card-visual.admin-card .chip{ background:linear-gradient(135deg,#dce7ff,#9fb8ff); }
  .rate-chart{height:130px; margin-top:6px; padding:8px; background:var(--bg-1); border:1px solid var(--line); border-radius:14px;}

  @media (min-width: 900px){

    .tab-btn{

    .tab-btn svg{ width:19px; height:19px; }

<script>
(function(){
  "use strict";

  var SESSION_KEY = "nova_play_current_v1";
  var ADMIN_EMAIL = "unrbank@gmail.com";
  var APP_NAME = "ЮНР Банк";
  var CUR = "N₴"; // demo currency symbol, deliberately not a real-money symbol/name

  // ---------- display currency (view-only conversion, storage stays in N₴) ----------
  // Approximate demo rates — purely cosmetic, does not affect any stored
  // balances. The "N" prefix keeps it clear this is fictional money either way.
  var DISPLAY_CURRENCIES = {
    UAH: {label:"Гривня", symbol:"N₴", rate:1},
    USD: {label:"Долар",  symbol:"N$", rate:1/41},
    CHF: {label:"Франк",  symbol:"N₣", rate:1/46},
    RUB: {label:"Рубль",  symbol:"N₽", rate:2.3}
  };
  var CURRENCY_PREF_KEY = "nova_display_currency";
  function getDisplayCurrencyCode(){
    try{ return localStorage.getItem(CURRENCY_PREF_KEY) || "UAH"; }catch(e){ return "UAH"; }
  }
  function setDisplayCurrencyCode(code){
    try{ localStorage.setItem(CURRENCY_PREF_KEY, code); }catch(e){}
  }
  // fmt(): converts a base (N₴) amount into the user's chosen display
  // currency and formats it with the right symbol. Use this everywhere a
  // money amount is shown to the user instead of formatMoney(...) + CUR.
  function fmt(amountInBase){
    var code = state.displayCurrency || "UAH";
    var cfg = DISPLAY_CURRENCIES[code] || DISPLAY_CURRENCIES.UAH;
    return formatMoney((amountInBase || 0) * cfg.rate) + " " + cfg.symbol;
  }
  function currentCurSymbol(){
    var code = state.displayCurrency || "UAH";
    return (DISPLAY_CURRENCIES[code] || DISPLAY_CURRENCIES.UAH).symbol;
  }

  var STARTING_BALANCE = 1000;
  var LOAN_TERM_MS = 3 * 24 * 60 * 60 * 1000; // 3 days
  var VIP_COST = 500000;
  var VIP_DAILY_PAYOUT = 10000;
  var VIP_PERIOD_MS = 24 * 60 * 60 * 1000;
  var MEGA_VIP_COST = 2000000;
  var MEGA_VIP_LEVEL_BONUS = 20;
  var MEGA_VIP_DAILY_PAYOUT = 100000;
  var SAVINGS_DAILY_RATE = 0.20; // +20% per day, compounded

  // Special demo account: gets a unique neon "MARSHAL" card and an
  // automatic monthly income, no purchase required (still fictional N₴).
  var MARSHAL_EMAIL = "marshalunr@gmail.com";
  var MARSHAL_MONTHLY_INCOME = 1000000;
  var MARSHAL_PERIOD_MS = 30 * 24 * 60 * 60 * 1000;

  // Earn-money mini-game tiers: solve a multiplication problem, harder
  // problems unlock bigger fictional rewards.
  var EARN_TIERS = [
    {reward: 50,   min: 2,  max: 9,   label: "Легко"},
    {reward: 150,  min: 5,  max: 20,  label: "Середньо"},
    {reward: 400,  min: 12, max: 40,  label: "Складно"},
    {reward: 1000, min: 20, max: 80,  label: "Важко"},
    {reward: 3000, min: 40, max: 150, label: "Експерт"}
  ];

  // ---------- companies: invest into your own company, get an instant
  // payout percentage that shrinks as the deposit gets bigger. The full
  // deposit stays locked in the company's capital (drives the leaderboard).
  var COMPANY_PAYOUT_TIERS = [
    {max: 1000,     percent: 0.50},
    {max: 5000,     percent: 0.35},
    {max: 20000,    percent: 0.20},
    {max: 100000,   percent: 0.10},
    {max: Infinity, percent: 0.05}
  ];
  function companyPayoutPercent(amount){
    for(var i=0;i<COMPANY_PAYOUT_TIERS.length;i++){
      if(amount <= COMPANY_PAYOUT_TIERS[i].max) return COMPANY_PAYOUT_TIERS[i].percent;
    }
    return COMPANY_PAYOUT_TIERS[COMPANY_PAYOUT_TIERS.length-1].percent;
  }

  var LOAN_LEVEL_LIMITS = [0, 500, 1000, 1800, 2800, 4000, 5000]; // index = level tier, capped at 5000
  var MAX_LOAN_CAP = 5000;

  // ---------- leveling: progress bar filled by money received ----------
  // Every level requires more money than the last (linear growth: level N
  // needs N * LEVEL_BASE_REQUIREMENT of *newly received* money to clear).
  var LEVEL_BASE_REQUIREMENT = 1000;
  function requiredForLevel(level){ return LEVEL_BASE_REQUIREMENT * level; }
  // Call whenever the user actually receives money (transfer in, sale,
  // VIP/Mega VIP payout, savings growth). Returns how many levels were
  // gained (0 if none) so the caller can show a toast.
  function addMoneyProgress(user, amount){
    if(!amount || amount <= 0) return 0;
    user.levelProgress = (user.levelProgress || 0) + amount;
    var gained = 0;
    while(user.levelProgress >= requiredForLevel(user.level) && gained < 200){
      user.levelProgress = Math.round((user.levelProgress - requiredForLevel(user.level)) * 100) / 100;
      user.level += 1;
      gained++;
    }
    return gained;
  }
  function loanTierForLevel(level){
    var idx = Math.min(Math.max(1, level), LOAN_LEVEL_LIMITS.length - 1);
    return idx;
  }
  function maxLoanForLevel(level){
    var idx = loanTierForLevel(level);
    return Math.min(LOAN_LEVEL_LIMITS[idx], MAX_LOAN_CAP);
  }

  // ================= Firebase Firestore storage =================
  // Fill in your own project's config below (Firebase Console → Project
  // settings → Your apps → SDK setup and configuration → Config).
  // This is what makes data sync across different devices/browsers when
  // the site is hosted as a plain static site (e.g. GitHub Pages) — the
  // app talks to your Firestore database in the cloud instead of the
  // browser's local storage.
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyCc_8l-wmNUOuP-DOLUiVuOsra0WgywLFM",
    authDomain: "nova-bank-55068.firebaseapp.com",
    projectId: "nova-bank-55068",
    storageBucket: "nova-bank-55068.firebasestorage.app",
    messagingSenderId: "313914933028",
    appId: "1:313914933028:web:993ce4316743b1340afdb1"
  };

  var db = null;
  var firebaseReady = false;
  try{
    if(window.firebase && FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY"){
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      firebaseReady = true;
    }
  }catch(e){ firebaseReady = false; }

  // Local fallback so the app still works (single-device only) if Firebase
  // isn't configured yet, or the network/Firestore is unreachable.
  var memoryFallback = {};
  var LOCAL_PREFIX = "nova_play_fallback:";
  function localFallbackGet(key){
    try{ var v = localStorage.getItem(LOCAL_PREFIX + key); return (v === null || v === undefined) ? null : v; }
    catch(e){ return (key in memoryFallback) ? memoryFallback[key] : null; }
  }
  function localFallbackSet(key, value){
    try{ localStorage.setItem(LOCAL_PREFIX + key, value); return true; }
    catch(e){ memoryFallback[key] = value; return true; }
  }
  function localFallbackDelete(key){
    try{ localStorage.removeItem(LOCAL_PREFIX + key); }catch(e){ delete memoryFallback[key]; }
  }
  function wait(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

  if(!firebaseReady){
    console.warn("ЮНР Банк: Firebase не налаштовано (FIREBASE_CONFIG). Дані зберігаються лише локально на цьому пристрої.");
  }

  // ---------- users ("users" collection, doc id = email) ----------
  async function getUser(email){
    if(firebaseReady){
      try{
        var snap = await db.collection("users").doc(email).get();
        if(snap.exists) return normalizeUser(snap.data());
        return null;
      }catch(e){ /* fall through to local */ }
    }
    var raw = localFallbackGet("user:" + email);
    if(!raw) return null;
    try{ return normalizeUser(JSON.parse(raw)); }catch(e){ return null; }
  }
  function normalizeUser(user){
    if(user.level === undefined) user.level = 1;
    if(user.levelProgress === undefined) user.levelProgress = 0;
    if(user.loan === undefined) user.loan = null;
    if(user.loanRepaid === undefined) user.loanRepaid = 0;
    if(user.vip === undefined) user.vip = false;
    if(user.vipSince === undefined) user.vipSince = null;
    if(user.vipLastPayout === undefined) user.vipLastPayout = null;
    if(user.mega === undefined) user.mega = false;
    if(user.megaSince === undefined) user.megaSince = null;
    if(user.megaLevelBonus === undefined) user.megaLevelBonus = 0;
    if(user.marshalLastPayout === undefined) user.marshalLastPayout = null;
    if(user.savings === undefined) user.savings = {balance: 0, lastGrowthAt: null};
    if(!user.savings) user.savings = {balance: 0, lastGrowthAt: null};
    if(user.savings.balance === undefined) user.savings.balance = 0;
    if(user.transactions === undefined) user.transactions = [];
    if(user.balance === undefined) user.balance = STARTING_BALANCE;
    return user;
  }
  async function saveUser(user){
    localFallbackSet("user:" + user.email, JSON.stringify(user)); // always keep an offline copy too
    if(firebaseReady){
      try{ await db.collection("users").doc(user.email).set(user); return true; }
      catch(e){ return true; } // local copy already saved
    }
    return true;
  }

  // ---------- card index ("cardindex" collection, doc id = digits) ----------
  async function getCardOwnerEmail(cardDigits){
    if(firebaseReady){
      try{
        var snap = await db.collection("cardindex").doc(cardDigits).get();
        return snap.exists ? snap.data().email : null;
      }catch(e){ /* fall through */ }
    }
    return localFallbackGet("cardindex:" + cardDigits);
  }
  async function reserveCard(cardDigits, email){
    localFallbackSet("cardindex:" + cardDigits, email);
    if(firebaseReady){
      try{ await db.collection("cardindex").doc(cardDigits).set({email: email}); return true; }
      catch(e){ return true; }
    }
    return true;
  }
  async function generateUniqueCard(){
    var digits, taken, attempts = 0;
    do{
      digits = "5375";
      for(var i=0;i<12;i++){ digits += Math.floor(Math.random()*10); }
      var owner = await getCardOwnerEmail(digits);
      taken = !!owner;
      attempts++;
    } while(taken && attempts < 25);
    return digits;
  }

  async function deleteListing(id){
    localFallbackDelete("listing:" + id);
    if(firebaseReady){
      try{ await db.collection("listings").doc(id).delete(); }catch(e){}
    }
  }
  async function getAllListings(retryOnEmpty){
    if(firebaseReady){
      try{
        var qs = await db.collection("listings").orderBy("createdAt", "desc").get();
        var out = [];
        qs.forEach(function(doc){ out.push(doc.data()); });
        if(out.length === 0 && retryOnEmpty){
          await wait(500);
          var qs2 = await db.collection("listings").orderBy("createdAt", "desc").get();
          qs2.forEach(function(doc){ out.push(doc.data()); });
        }
        return out;
      }catch(e){ /* fall through to local */ }
    }
    // local-only fallback: scan localStorage keys with the listing: prefix
    var out2 = [];
    try{
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf(LOCAL_PREFIX + "listing:") === 0){
          try{ out2.push(JSON.parse(localStorage.getItem(k))); }catch(e){}
        }
      }
    }catch(e){}
    return out2.sort(function(a,b){ return b.createdAt - a.createdAt; });
  }

  // ---------- utils ----------
  function normalizeEmail(e){ return (e||"").replace(/\s+/g, "").toLowerCase(); }
  function isValidEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function formatMoney(n){
    n = Math.round(n * 100) / 100;
    var neg = n < 0; n = Math.abs(n);
    var parts = n.toFixed(2).split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (neg ? "-" : "") + parts[0] + "," + parts[1];
  }
  function formatDate(ts){
    var d = new Date(ts);
    var day = String(d.getDate()).padStart(2,"0");
    var monthNames = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
    var hh = String(d.getHours()).padStart(2,"0");
    var mm = String(d.getMinutes()).padStart(2,"0");
    return day + " " + monthNames[d.getMonth()] + " · " + hh + ":" + mm;
  }
  function formatDuration(ms){
    if(ms <= 0) return "00:00:00";
    var s = Math.floor(ms/1000);
    var d = Math.floor(s / 86400); s -= d*86400;
    var h = Math.floor(s / 3600); s -= h*3600;
    var m = Math.floor(s / 60); s -= m*60;
    if(d > 0) return d + "д " + String(h).padStart(2,"0") + "г " + String(m).padStart(2,"0") + "хв";
    return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  }
  function last4(digits){ return digits ? digits.slice(-4) : "----"; }
  function maskCard(digits){ return digits ? "•••• •••• •••• " + last4(digits) : "•••• •••• •••• ----"; }
  function cardDigitsOnly(v){ return (v||"").replace(/\D/g,""); }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
  }
  function showToast(msg, type){
    var c = document.getElementById("toast-container");
    var el = document.createElement("div");
    el.className = "toast" + (type ? " " + type : "");
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(function(){ el.remove(); }, 3100);
  }

        input.classList.add("error");

  async function loginOrRegister(email){
    var user;
    try{ user = await getUser(email); }
    catch(e){ showToast("Помилка синхронізації. Спробуйте ще раз", "error"); render(); return; }
    if(!user){
      try{
        var cardDigits = await generateUniqueCard();
        user = normalizeUser({
          email: email,
          card: cardDigits.replace(/(.{4})/g,"$1 ").trim(),
          balance: STARTING_BALANCE,
          transactions: [{id:uid(), kind:"bonus", amount: STARTING_BALANCE, date: Date.now(), purpose:"Стартовий бонус гри"}],
          createdAt: Date.now()
        });
        await saveUser(user);
        await reserveCard(cardDigits, email);
      }catch(e){
        showToast("Не вдалося створити профіль. Спробуйте ще раз", "error"); render(); return;
      }
      showToast("Профіль створено! +" + fmt(STARTING_BALANCE) + " стартового бонусу");
    } else {
      showToast("З поверненням!");
    }
    setSession(email);
    state.email = email; state.user = user; state.screen = "home"; state.tab = "home";
    render();
    startTimers();
  }

  // ---------- periodic checks: loan default + vip payout ----------
  function startTimers(){
    if(state.timerHandle) clearInterval(state.timerHandle);
    state.timerHandle = setInterval(function(){
      if(state.screen === "home" && !state.modal) updateLiveTimers();
    }, 1000);
    if(state.payoutCheckHandle) clearInterval(state.payoutCheckHandle);
    checkLoanAndVip();
    state.payoutCheckHandle = setInterval(checkLoanAndVip, 15000);
  }

  function updateLiveTimers(){
    var u = state.user; if(!u) return;
    var loanEl = document.getElementById("loan-timer-val");
    if(loanEl && u.loan){
      var remain = u.loan.dueAt - Date.now();
      loanEl.textContent = formatDuration(remain);
      loanEl.className = "timer" + (remain < 6*60*60*1000 ? " danger" : "");
      var fill = document.getElementById("loan-progress-fill");
      if(fill){
        var total = u.loan.dueAt - u.loan.takenAt;
        var pct = Math.max(0, Math.min(100, (remain/total)*100));
        fill.style.width = pct + "%";
        fill.className = "progress-fill" + (pct < 20 ? " danger" : "");
      }
    }
    var vipEl = document.getElementById("vip-timer-val");
    if(vipEl && (u.vip || u.mega)){
      var nextAt = (u.vipLastPayout || u.vipSince || u.megaSince) + VIP_PERIOD_MS;
      var remainV = nextAt - Date.now();
      vipEl.textContent = remainV > 0 ? formatDuration(remainV) : "Готово до виплати";
    }
    var savEl = document.getElementById("savings-timer-val");
    if(savEl && u.savings && u.savings.balance > 0){
      var nextS = (u.savings.lastGrowthAt || Date.now()) + VIP_PERIOD_MS;
      var remainS = nextS - Date.now();
      savEl.textContent = remainS > 0 ? formatDuration(remainS) : "Готово до нарахування";
    }
  }

  async function checkLoanAndVip(){
    if(!state.email) return;
    var user = await getUser(state.email);
    if(!user) return;
    var changed = false;
    var now = Date.now();

    if(user.loan && now >= user.loan.dueAt){
      var amt = user.loan.amount;
      user.balance = Math.round((user.balance - amt) * 100) / 100; // auto-deduct; can go negative (debt)
      user.transactions.push({id:uid(), kind:"loan_auto", amount:-amt, date: now, purpose:"Автосписання за прострочений кредит"});
      user.loan = null;
      changed = true;
      if(state.email){ showToast("Кредит не сплачено вчасно — " + fmt(amt) + " списано автоматично", "error"); }
    }

    if(user.vip || user.mega){
      var last = user.vipLastPayout || user.vipSince || user.megaSince || now;
      if(now - last >= VIP_PERIOD_MS){
        var cycles = Math.floor((now - last) / VIP_PERIOD_MS);
        cycles = Math.min(cycles, 30); // safety cap for demo
        var dailyAmt = user.mega ? MEGA_VIP_DAILY_PAYOUT : VIP_DAILY_PAYOUT;
        var payout = cycles * dailyAmt;
        user.balance = Math.round((user.balance + payout) * 100) / 100;
        user.vipLastPayout = last + cycles * VIP_PERIOD_MS;
        user.transactions.push({id:uid(), kind:"vip_payout", amount: payout, date: now, purpose:(user.mega ? "Мега VIP" : "VIP") + " щоденна виплата (" + cycles + "x)"});
        var gainedLv1 = addMoneyProgress(user, payout);
        if(gainedLv1 > 0) showToast("Рівень підвищено до " + user.level + "!", "gold");
        changed = true;
        showToast((user.mega ? "Мега VIP" : "VIP") + "-виплата: +" + fmt(payout), "gold");
      }
    }

    if(user.email === MARSHAL_EMAIL){
      var lastM = user.marshalLastPayout || user.createdAt || now;
      if(now - lastM >= MARSHAL_PERIOD_MS){
        var cyclesM = Math.floor((now - lastM) / MARSHAL_PERIOD_MS);
        cyclesM = Math.min(cyclesM, 12); // safety cap for demo
        var payoutM = cyclesM * MARSHAL_MONTHLY_INCOME;
        user.balance = Math.round((user.balance + payoutM) * 100) / 100;
        user.marshalLastPayout = lastM + cyclesM * MARSHAL_PERIOD_MS;
        user.transactions.push({id:uid(), kind:"marshal_payout", amount: payoutM, date: now, purpose:"MARSHAL щомісячна виплата (" + cyclesM + "x)"});
        addMoneyProgress(user, payoutM);
        changed = true;
        showToast("MARSHAL-виплата: +" + fmt(payoutM), "gold");
        if(state.email === MARSHAL_EMAIL){
          state.marshalFlash = true;
          setTimeout(function(){ state.marshalFlash = false; render(); }, 5000);
        }
      }
    }

    if(user.savings && user.savings.balance > 0){
      var lastS = user.savings.lastGrowthAt || now;
      if(now - lastS >= VIP_PERIOD_MS){
        var cyclesS = Math.floor((now - lastS) / VIP_PERIOD_MS);
        cyclesS = Math.min(cyclesS, 30); // safety cap for demo
        var before = user.savings.balance;
        var grown = before * Math.pow(1 + SAVINGS_DAILY_RATE, cyclesS);
        grown = Math.round(grown * 100) / 100;
        var gain = Math.round((grown - before) * 100) / 100;
        user.savings.balance = grown;
        user.savings.lastGrowthAt = lastS + cyclesS * VIP_PERIOD_MS;
        user.transactions.push({id:uid(), kind:"savings_growth", amount: gain, date: now, purpose:"Нарахування на зберігальному рахунку (" + cyclesS + "x, +20%/день)"});
        var gainedLv2 = addMoneyProgress(user, gain);
        if(gainedLv2 > 0) showToast("Рівень підвищено до " + user.level + "!", "gold");
        changed = true;
        showToast("Зберігальний рахунок: +" + fmt(gain), "gold");
      }
    }

    if(changed){
      await saveUser(user);
      if(state.email === user.email){ state.user = user; render(); }
    }
  }

  function rateChartHtml(user){
    var txs = (user.transactions || []).slice().sort(function(a,b){ return a.date - b.date; });
    if(txs.length === 0) return '';
    // Build a running-balance series (like the temperature-chart example):
    // start from 0 and add each transaction in order, so the line shows
    // how the balance actually moved over time.
    var points = [0];
    var running = 0;
    txs.forEach(function(t){ running = Math.round((running + t.amount) * 100) / 100; points.push(running); });
    points = points.slice(-25); // keep the chart readable

    var w = 600, h = 140, padX = 6, padY = 14;
    var minV = Math.min.apply(null, points), maxV = Math.max.apply(null, points);
    if(minV === maxV){ minV -= 1; maxV += 1; }
    var stepX = points.length > 1 ? (w - padX*2) / (points.length - 1) : 0;
    function xAt(i){ return padX + i*stepX; }
    function yAt(v){ return padY + (1 - (v - minV)/(maxV - minV)) * (h - padY*2); }

    var segments = "";
    for(var i=0; i<points.length-1; i++){
      var x1=xAt(i), y1=yAt(points[i]), x2=xAt(i+1), y2=yAt(points[i+1]);
      var color = points[i+1] >= points[i] ? "#30d158" : "#ff453a";
      segments += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round"/>';
    }
    var dots = "";
    points.forEach(function(v, i){
      var dotColor = (i===0) ? "#8e8e93" : (v >= points[i-1] ? "#30d158" : "#ff453a");
      dots += '<circle cx="'+xAt(i)+'" cy="'+yAt(v)+'" r="2.6" fill="'+dotColor+'"/>';
    });

    var last = points[points.length-1];
    var lastColor = points.length>1 && last >= points[points.length-2] ? "#30d158" : "#ff453a";

    return '<div class="section-label" style="margin-bottom:8px; display:flex; align-items:center; justify-content:space-between;">' +
        '<span>Курс гаманця <span style="text-transform:none; font-weight:600; font-size:11.5px; color:var(--text-2);">(рух балансу)</span></span>' +
        '<span class="num" style="font-size:12px; font-weight:800; color:' + lastColor + ';">' + (last>=0?"+":"") + fmt(last) + '</span>' +
      '</div>' +
      '<div class="rate-chart">' +
        '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="width:100%; height:100%; display:block;">' + segments + dots + '</svg>' +
      '</div>';
  }

  function animateBalance(el, targetBase){
    var code = state.displayCurrency || "UAH";
    var rate = (DISPLAY_CURRENCIES[code] || DISPLAY_CURRENCIES.UAH).rate;
    var target = targetBase * rate;
    var start = 0, duration = 700, startTime = null;
    function step(ts){
      if(!startTime) startTime = ts;
      var progress = Math.min((ts - startTime) / duration, 1);
      var eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = formatMoney(start + (target - start) * eased);
      if(progress < 1) requestAnimationFrame(step); else el.textContent = formatMoney(target);
    }
    requestAnimationFrame(step);
  }

  function copyCardNumber(card, btn, label){
    var text = card.replace(/\s/g,"");
    function done(){
      var original = label.textContent;
      btn.innerHTML = ICONS.check + '<span>Скопійовано</span>';
      showToast("Номер картки скопійовано");
      setTimeout(function(){ btn.innerHTML = ICONS.copy + '<span>' + original + '</span>'; }, 1600);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  }
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
  }

  // ---------- on-screen numpad: tap digits instead of the OS keyboard ----------
  // Turns a money-amount <input> into a tap-only field with a numeric grid
  // rendered right after it (matching the "amount entry" UX pattern).
  function attachNumpad(afterEl, inputEl, opts){
    opts = opts || {};
    var maxLen = opts.maxLen || 12;
    inputEl.setAttribute("readonly", "readonly");
    inputEl.setAttribute("inputmode", "none");
    inputEl.classList.add("numpad-input");

    var pad = document.createElement("div");
    pad.className = "numpad";
    var keys = ["1","2","3","4","5","6","7","8","9",",","0","back"];
    keys.forEach(function(k){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "numpad-key" + (k === "back" ? " numpad-back" : "");
      btn.textContent = k === "back" ? "⌫" : k;
      btn.addEventListener("click", function(){
        var val = inputEl.value || "";
        if(k === "back"){
          val = val.slice(0, -1);
        } else if(k === ","){
          if(val.indexOf(".") === -1){ val = (val === "" ? "0" : val) + "."; }
        } else {
          if(val === "0") val = k; else val = val + k;
        }
        if(val.replace(".", "").length > maxLen) return;
        inputEl.value = val;
        inputEl.dispatchEvent(new Event("input", {bubbles:true}));
      });
      pad.appendChild(btn);
    });
    afterEl.parentNode.insertBefore(pad, afterEl.nextSibling);
    inputEl.addEventListener("click", function(){ pad.scrollIntoView({behavior:"smooth", block:"nearest"}); });
    return pad;
  }

  async function repayLoan(){
    var user = await getUser(state.email);
    if(!user || !user.loan){ showToast("Активного кредиту немає", "error"); return; }
    if(user.balance < user.loan.amount){
      showToast("Недостатньо коштів для дострокового погашення", "error"); return;
    }
    var amt = user.loan.amount;
    user.balance = Math.round((user.balance - amt) * 100) / 100;
    user.transactions.push({id:uid(), kind:"loan_repay", amount:-amt, date: Date.now(), purpose:"Дострокове погашення"});
    user.loanRepaid = (user.loanRepaid || 0) + 1;
    user.loan = null;
    await saveUser(user);
    state.user = user;
    render();
    showToast("Кредит погашено");

      // captured when the modal first opened.

      closeModal();
      showToast("Кредит " + fmt(amount) + " зараховано. Погасіть протягом 3 днів");
    });

    return overlay;

  async function loadMarketContent(container){
    container.innerHTML = '<div class="empty-state" style="padding:30px 10px;"><span class="spinner dark" style="display:inline-block;"></span></div>';
    if(state.marketTab === "catalog"){
      var grid = document.createElement("div");
      grid.className = "grid";
      CATALOG.forEach(function(p){
        grid.appendChild(productCardEl({
          name: p.name, price: p.price, emoji: p.emoji, sellerLabel: "NOVA Маркет",
          onBuy: function(qty){ buyCatalogItem(p, qty); }
        }));
      });
      container.innerHTML = ""; container.appendChild(grid);
      return;
    }

    var all = await getAllListings(state.marketTab === "mine");
    if(state.marketTab === "community"){
      var mine = state.email;
      var others = all.filter(function(l){ return l.sellerEmail !== mine; });
      container.innerHTML = "";
      var grid2 = document.createElement("div");
      grid2.className = "grid";
      if(others.length === 0){
        grid2.innerHTML = '<div class="empty-state">Поки що немає оголошень від інших гравців</div>';
      } else {
        others.forEach(function(l){
          grid2.appendChild(productCardEl({
            name: l.title, price: l.price, emoji: "📦", sellerLabel: l.sellerEmail.split("@")[0],
            onBuy: function(qty){ buyListing(l, qty); }
          }));
        });
      }
      container.appendChild(grid2);
    } else if(state.marketTab === "mine"){
      var myListings = all.filter(function(l){ return l.sellerEmail === state.email; });
      container.innerHTML = "";
      if(myListings.length === 0){
        container.innerHTML = '<div class="empty-state">У вас ще немає оголошень. Натисніть «+ Продати», щоб виставити товар.</div>';
      } else {
        myListings.forEach(function(l){
          var row = document.createElement("div");
          row.className = "my-listing";
          row.innerHTML = '<div class="info"><div class="title">' + escapeHtml(l.title) + '</div><div class="price">' + fmt(l.price) + '</div></div>' +

            await deleteListing(l.id);
            showToast("Оголошення видалено");
            render();
          });
          container.appendChild(row);
        });
      }
    }

  async function buyCatalogItem(product, qty){
    qty = Math.max(1, Math.round(qty || 1));
    var total = Math.round(product.price * qty * 100) / 100;
    var user = await getUser(state.email);
    if(!user){ showToast("Помилка синхронізації", "error"); return; }
    if(user.balance < total){ showToast("Недостатньо коштів", "error"); return; }
    user.balance = Math.round((user.balance - total) * 100) / 100;
    var label = qty > 1 ? (product.name + " ×" + qty) : product.name;
    user.transactions.push({id:uid(), kind:"purchase", amount:-total, date: Date.now(), purpose: label});
    var ok = await saveUser(user);
    if(!ok){ showToast("Не вдалося купити товар", "error"); return; }
    state.user = user;
    showToast("Куплено: " + label);
    render();
  }

  async function buyListing(listing, qty){
    qty = Math.max(1, Math.round(qty || 1));
    var total = Math.round(listing.price * qty * 100) / 100;
    var buyer = await getUser(state.email);
    if(!buyer){ showToast("Помилка синхронізації", "error"); return; }
    if(buyer.balance < total){ showToast("Недостатньо коштів", "error"); return; }

    var fresh = await getListing(listing.id);
    if(!fresh){ showToast("Оголошення вже недоступне", "error"); render(); return; }

    var seller = await getUser(listing.sellerEmail);
    if(!seller){ showToast("Продавця не знайдено", "error"); return; }

    var label = qty > 1 ? (listing.title + " ×" + qty) : listing.title;
    buyer.balance = Math.round((buyer.balance - total) * 100) / 100;
    seller.balance = Math.round((seller.balance + total) * 100) / 100;
    var now = Date.now();
    buyer.transactions.push({id:uid(), kind:"purchase", amount:-total, date: now, purpose: label + " (від " + seller.email.split("@")[0] + ")"});
    seller.transactions.push({id:uid(), kind:"sale", amount:total, date: now, purpose: label});
    addMoneyProgress(seller, total);

    await saveUser(buyer);
    await saveUser(seller);
    await deleteListing(listing.id);

    state.user = buyer;
    showToast("Куплено: " + listing.title);
    render();
  }

        '<div style="font-size:28px; font-weight:800; font-family:\'JetBrains Mono\',monospace;" id="earn-problem">' + a + ' × ' + b + ' = ?</div>' +
      '</div>' +
      '<div class="field" style="margin-top:14px;"><input type="number" id="earn-answer" placeholder="Ваша відповідь" inputmode="numeric"></div>' +
      '<div class="err-msg" id="earn-error"></div>' +
      '<button class="btn btn-primary" id="earn-submit"><span id="earn-submit-label">Перевірити</span></button>';
    overlay.appendChild(modal);

    var problemEl = modal.querySelector("#earn-problem");
    var answerInput = modal.querySelector("#earn-answer");
    var errEl = modal.querySelector("#earn-error");
    var submitBtn = modal.querySelector("#earn-submit");
    var submitLabel = modal.querySelector("#earn-submit-label");
    var chipsWrap = modal.querySelector("#tier-chips");

    function refreshChips(){
      chipsWrap.innerHTML = tierChipsHtml();
      chipsWrap.querySelectorAll(".amount-chip").forEach(function(el){
        el.addEventListener("click", function(){
          currentTierIdx = parseInt(el.getAttribute("data-tier"), 10);
          newProblem(currentTierIdx);
          problemEl.textContent = a + " × " + b + " = ?";
          answerInput.value = "";
          errEl.textContent = "";
          refreshChips();
        });
      });
    }
    refreshChips();

    overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
    modal.querySelector("#modal-close").addEventListener("click", closeModal);
    answerInput.addEventListener("input", function(){ errEl.textContent = ""; });
    answerInput.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); submitBtn.click(); } });

    submitBtn.addEventListener("click", async function(){
      var val = parseInt(answerInput.value, 10);
      if(isNaN(val)){ errEl.textContent = "Введіть відповідь"; return; }

      if(val !== correctAnswer){
        errEl.textContent = "Неправильно. Спробуйте новий приклад";
        newProblem(currentTierIdx);
        problemEl.textContent = a + " × " + b + " = ?";
        answerInput.value = "";
        return;
      }

      submitBtn.disabled = true; answerInput.disabled = true;
      submitLabel.innerHTML = '<span class="spinner"></span>';

      var reward = EARN_TIERS[currentTierIdx].reward;
      var fresh = await getUser(state.email);
      if(!fresh){ showToast("Помилка синхронізації", "error"); closeModal(); return; }
      fresh.balance = Math.round((fresh.balance + reward) * 100) / 100;
      fresh.transactions.push({id:uid(), kind:"earn_math", amount: reward, date: Date.now(), purpose:"Приклад на " + EARN_TIERS[currentTierIdx].label.toLowerCase()});
      addMoneyProgress(fresh, reward);

      var ok = await saveUser(fresh);
      if(!ok){ showToast("Не вдалося зарахувати винагороду", "error"); submitBtn.disabled=false; answerInput.disabled=false; submitLabel.textContent="Перевірити"; return; }

      state.user = fresh;
      closeModal();
      showToast("Правильно! +" + fmt(reward));
    });

    setTimeout(function(){ answerInput.focus(); }, 300);
    return overlay;
  }

    confirmBtn.addEventListener("click", async function(){
      confirmBtn.disabled = true;

      fresh.level = 1;
      fresh.levelProgress = 0;
      fresh.loan = null;

  // ---------- company modal (create / invest / leaderboard) ----------
  function renderCompanyModal(){
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    var modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML =
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>🏢 Компанія</h2><button class="close-x" id="modal-close">&times;</button></div>' +
      '<div id="company-body"><div class="empty-state" style="padding:24px 0;"><span class="spinner dark" style="display:inline-block;"></span></div></div>';
    overlay.appendChild(modal);

    overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
    modal.querySelector("#modal-close").addEventListener("click", closeModal);

    loadCompanyBody(modal.querySelector("#company-body"));
    return overlay;
  }

  async function loadCompanyBody(container){
    var myCompany = await getCompany(state.email);
    var allCompanies = await getAllCompanies();

    var leaderboardHtml = '<div class="section-label" style="margin-top:22px; margin-bottom:8px;">🏆 Найбагатші компанії</div>';
    if(allCompanies.length === 0){
      leaderboardHtml += '<div class="empty-state" style="padding:20px 10px;">Поки що немає жодної компанії</div>';
    } else {
      leaderboardHtml += allCompanies.slice(0, 10).map(function(c, i){
        return '<div class="my-listing"><div class="info"><div class="title">' + (i+1) + '. ' + escapeHtml(c.name) + '</div>' +
          '<div class="price">Власник: ' + escapeHtml((c.ownerEmail||"").split("@")[0]) + '</div></div>' +
          '<div class="prod-price">' + fmt(c.capital||0) + '</div></div>';
      }).join("");
    }

    if(!myCompany){
      container.innerHTML =
        '<div class="info-card-sub" style="margin-bottom:14px;">У вас ще немає компанії. Створіть свою — потім вкладайте в неї гроші: невеликі вклади дають до 50% миттєвого прибутку, великі — менший відсоток, зате капітал компанії росте й вона піднімається в рейтингу.</div>' +
        '<div class="field"><div class="field-label">Назва компанії</div><input type="text" id="company-name" placeholder="Напр. UNR Trading" maxlength="40"></div>' +
        '<div class="err-msg" id="company-error"></div>' +
        '<button class="btn btn-primary" id="company-create-btn">Створити компанію</button>' +
        leaderboardHtml;

      container.querySelector("#company-create-btn").addEventListener("click", async function(){
        var nameInput = container.querySelector("#company-name");
        var errEl = container.querySelector("#company-error");
        var name = nameInput.value.trim();
        if(!name){ errEl.textContent = "Введіть назву компанії"; return; }

        var btn = container.querySelector("#company-create-btn");
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

        var company = {ownerEmail: state.email, name: name, capital: 0, createdAt: Date.now()};
        var ok = await saveCompany(company);
        if(!ok){ errEl.textContent = "Не вдалося створити компанію"; btn.disabled=false; btn.textContent="Створити компанію"; return; }

        showToast("Компанію «" + name + "» створено");
        loadCompanyBody(container);
      });
      return;
    }

    // has a company already: show invest form
    var tierRows = COMPANY_PAYOUT_TIERS.map(function(t, i){
      var prevMax = i===0 ? 0 : COMPANY_PAYOUT_TIERS[i-1].max;
      var rangeLabel = (t.max === Infinity) ? ('від ' + fmt(prevMax)) : (fmt(prevMax) + ' – ' + fmt(t.max));
      return '<div class="receipt-row"><div class="k">' + rangeLabel + '</div><div class="v">' + Math.round(t.percent*100) + '%</div></div>';
    }).join("");

    container.innerHTML =
      '<div class="info-card">' +
        '<div class="info-card-title">' + escapeHtml(myCompany.name) + '</div>' +
        '<div class="info-card-sub">Капітал компанії: <b style="color:var(--text-0);">' + fmt(myCompany.capital||0) + '</b></div>' +
      '</div>' +
      '<div class="field"><div class="field-label">Сума вкладу</div>' +
      '<input type="number" id="company-amount" placeholder="0" inputmode="decimal" min="1" step="1">' +
      '<div class="chip-row" id="company-chips"></div></div>' +
      '<div class="info-card-sub" id="company-preview" style="margin-bottom:10px;"></div>' +
      '<div class="err-msg" id="company-error"></div>' +
      '<button class="btn btn-primary" id="company-invest-btn"><span id="company-invest-label">Вкласти</span></button>' +
      '<div class="section-label" style="margin-top:20px; margin-bottom:6px;">Шкала прибутку</div>' +
      '<div class="receipt-rows">' + tierRows + '</div>' +
      leaderboardHtml;

    var amountInput = container.querySelector("#company-amount");
    var previewEl = container.querySelector("#company-preview");
    var errEl = container.querySelector("#company-error");
    var chipsRow = container.querySelector("#company-chips");
    [500, 2000, 10000, 50000].forEach(function(v){
      var chip = document.createElement("div");
      chip.className = "amount-chip";
      chip.textContent = fmt(v);
      chip.addEventListener("click", function(){ amountInput.value = v; updatePreview(); });
      chipsRow.appendChild(chip);
    });
    attachNumpad(amountInput, amountInput);

    function updatePreview(){
      var amt = parseFloat(amountInput.value);
      if(!amt || amt <= 0){ previewEl.textContent = ""; return; }
      var pct = companyPayoutPercent(amt);
      var payout = amt * pct;
      previewEl.innerHTML = 'Ви отримаєте одразу <b style="color:var(--success);">+' + fmt(payout) + '</b> (' + Math.round(pct*100) + '%), а ' + fmt(amt) + ' поповнить капітал компанії.';
    }
    amountInput.addEventListener("input", function(){ errEl.textContent = ""; updatePreview(); });

    var investBtn = container.querySelector("#company-invest-btn");
    var investLabel = container.querySelector("#company-invest-label");
    investBtn.addEventListener("click", async function(){
      var amt = parseFloat(amountInput.value);
      if(!amt || amt <= 0){ errEl.textContent = "Введіть суму вкладу"; return; }

      investBtn.disabled = true; amountInput.disabled = true;
      investLabel.innerHTML = '<span class="spinner"></span>';

      var freshUser = await getUser(state.email);
      var freshCompany = await getCompany(state.email);
      if(!freshUser || !freshCompany){ showToast("Помилка синхронізації", "error"); closeModal(); return; }
      if(freshUser.balance < amt){
        errEl.textContent = "Недостатньо коштів";
        investBtn.disabled=false; amountInput.disabled=false; investLabel.textContent="Вкласти"; return;
      }

      var pct = companyPayoutPercent(amt);
      var payout = Math.round(amt * pct * 100) / 100;
      var now = Date.now();

      freshUser.balance = Math.round((freshUser.balance - amt + payout) * 100) / 100;
      freshUser.transactions.push({id:uid(), kind:"company_invest", amount:-amt, date: now, purpose:"Вклад у компанію «" + freshCompany.name + "»"});
      freshUser.transactions.push({id:uid(), kind:"company_payout", amount: payout, date: now, purpose:"Прибуток від компанії (" + Math.round(pct*100) + "%)"});
      addMoneyProgress(freshUser, payout);

      freshCompany.capital = Math.round(((freshCompany.capital||0) + amt) * 100) / 100;

      var ok1 = await saveUser(freshUser);
      var ok2 = await saveCompany(freshCompany);
      if(!ok1 || !ok2){
        showToast("Не вдалося виконати вклад", "error");
        investBtn.disabled=false; amountInput.disabled=false; investLabel.textContent="Вкласти"; return;
      }

      state.user = freshUser;
      showToast("Вкладено " + fmt(amt) + ", отримано +" + fmt(payout));
      closeModal();
    });
  }

  // ---------- transfer modal ----------
  function renderTransferModal(){
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    var modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML =
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>Переказ на картку</h2><button class="close-x" id="modal-close">&times;</button></div>' +
      '<div class="field"><div class="field-label">Номер картки отримувача</div>' +
      '<input type="text" id="tr-card" class="num" placeholder="0000 0000 0000 0000" inputmode="numeric" maxlength="19"></div>' +
      '<div class="field"><div class="field-label">Сума</div>' +
      '<input type="number" id="tr-amount" placeholder="0" inputmode="decimal" min="0" step="0.01"></div>' +
      '<div class="err-msg" id="tr-error"></div>' +
      '<button class="btn btn-primary" id="tr-submit" style="margin-top:8px;"><span id="tr-submit-label">Переказати</span></button>';
    overlay.appendChild(modal);

    var cardInput = modal.querySelector("#tr-card");
    var amountInput = modal.querySelector("#tr-amount");
    var errEl = modal.querySelector("#tr-error");
    var submitBtn = modal.querySelector("#tr-submit");
    var submitLabel = modal.querySelector("#tr-submit-label");

    cardInput.addEventListener("input", function(){
      var digits = cardDigitsOnly(cardInput.value).slice(0,16);
      cardInput.value = digits.replace(/(.{4})/g,"$1 ").trim();
      errEl.textContent = ""; cardInput.classList.remove("error");
    });
    amountInput.addEventListener("input", function(){ errEl.textContent = ""; amountInput.classList.remove("error"); });

    overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
    modal.querySelector("#modal-close").addEventListener("click", closeModal);

    submitBtn.addEventListener("click", async function(){
      errEl.textContent = ""; cardInput.classList.remove("error"); amountInput.classList.remove("error");
      var cardDigits = cardDigitsOnly(cardInput.value);
      var amount = parseFloat(amountInput.value);

      if(cardDigits.length !== 16){ errEl.textContent = "Введіть коректний номер картки (16 цифр)"; cardInput.classList.add("error"); return; }
      if(!amount || amount <= 0){ errEl.textContent = "Введіть суму переказу"; amountInput.classList.add("error"); return; }
      if(cardDigits === state.user.card.replace(/\s/g,"")){ errEl.textContent = "Не можна переказати кошти самому собі"; return; }

      submitBtn.disabled = true; cardInput.disabled = true; amountInput.disabled = true;
      submitLabel.innerHTML = '<span class="spinner"></span>';

      var sender = await getUser(state.email);
      if(!sender){ showToast("Помилка синхронізації", "error"); closeModal(); return; }
      if(amount > sender.balance){
        errEl.textContent = "Недостатньо коштів";
        submitBtn.disabled=false; cardInput.disabled=false; amountInput.disabled=false; submitLabel.textContent="Переказати"; return;
      }
      var receiverEmail = await getCardOwnerEmail(cardDigits);
      if(!receiverEmail){
        errEl.textContent = "Картку не знайдено"; cardInput.classList.add("error");
        submitBtn.disabled=false; cardInput.disabled=false; amountInput.disabled=false; submitLabel.textContent="Переказати"; return;
      }
      var receiver = await getUser(receiverEmail);
      if(!receiver){
        errEl.textContent = "Картку не знайдено";
        submitBtn.disabled=false; cardInput.disabled=false; amountInput.disabled=false; submitLabel.textContent="Переказати"; return;
      }

      sender.balance = Math.round((sender.balance - amount) * 100) / 100;
      receiver.balance = Math.round((receiver.balance + amount) * 100) / 100;
      var now = Date.now();
      var senderCardDigits = sender.card.replace(/\s/g,"");
      var receiverCardDigits = receiver.card.replace(/\s/g,"");

      var txOut = {id: uid(), kind:"transfer_out", amount:-amount, date: now, senderCard: senderCardDigits, receiverCard: receiverCardDigits, purpose:"Переказ коштів"};
      var txIn = {id: uid(), kind:"transfer_in", amount: amount, date: now, senderCard: senderCardDigits, receiverCard: receiverCardDigits, purpose:"Переказ коштів"};
      sender.transactions.push(txOut);
      receiver.transactions.push(txIn);
      addMoneyProgress(receiver, amount);

      var ok1 = await saveUser(sender);
      var ok2 = await saveUser(receiver);
      if(!ok1 || !ok2){
        showToast("Не вдалося виконати переказ", "error");
        submitBtn.disabled=false; cardInput.disabled=false; amountInput.disabled=false; submitLabel.textContent="Переказати"; return;
      }

      state.user = sender;
      state.modal = {type:"receipt", tx:txOut};
      render();
      showToast("Переказано " + fmt(amount));
    });

    attachNumpad(amountInput, amountInput);
    setTimeout(function(){ cardInput.focus(); }, 300);
    return overlay;
  }

  // ---------- topup modal (admin only, demo currency) ----------
  function renderTopupModal(){
    if(state.email !== ADMIN_EMAIL){ state.modal = null; return document.createElement("div"); }
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    var modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML =
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>Поповнення (адмін, демо)</h2><button class="close-x" id="modal-close">&times;</button></div>' +
      '<div class="field"><div class="field-label">Сума поповнення</div>' +
      '<input type="number" id="tp-amount" placeholder="0" inputmode="decimal" min="0" step="0.01"></div>' +
      '<div class="err-msg" id="tp-error"></div>' +
      '<button class="btn btn-primary" id="tp-submit" style="margin-top:8px;"><span id="tp-submit-label">Поповнити</span></button>';
    overlay.appendChild(modal);

    var amountInput = modal.querySelector("#tp-amount");
    var errEl = modal.querySelector("#tp-error");
    var submitBtn = modal.querySelector("#tp-submit");
    var submitLabel = modal.querySelector("#tp-submit-label");

    overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
    modal.querySelector("#modal-close").addEventListener("click", closeModal);
    amountInput.addEventListener("input", function(){ errEl.textContent = ""; amountInput.classList.remove("error"); });

    submitBtn.addEventListener("click", async function(){
      var amount = parseFloat(amountInput.value);
      if(!amount || amount <= 0){ errEl.textContent = "Введіть суму поповнення"; amountInput.classList.add("error"); return; }
      submitBtn.disabled = true; amountInput.disabled = true;
      submitLabel.innerHTML = '<span class="spinner"></span>';

      var user = await getUser(state.email);
      if(!user){ showToast("Помилка синхронізації", "error"); closeModal(); return; }
      user.balance = Math.round((user.balance + amount) * 100) / 100;
      var tx = {id: uid(), kind:"topup", amount: amount, date: Date.now(), receiverCard: user.card.replace(/\s/g,""), purpose:"Демо-поповнення"};
      user.transactions.push(tx);

      var ok = await saveUser(user);
      if(!ok){ showToast("Не вдалося поповнити рахунок", "error"); submitBtn.disabled=false; amountInput.disabled=false; submitLabel.textContent="Поповнити"; return; }

      state.user = user;
      state.modal = {type:"receipt", tx:tx};
      render();
      showToast("Баланс поповнено на " + fmt(amount));
    });

    attachNumpad(amountInput, amountInput);
    return overlay;
  }

  // ---------- receipt modal ----------
  function renderReceiptModal(tx){
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    var modal = document.createElement("div");
    modal.className = "modal";

    var isGoldKind = tx.kind === "vip_buy" || tx.kind === "vip_payout" || tx.kind === "marshal_payout";
    var isTopup = tx.kind === "topup" || tx.kind === "bonus";
    var isOut = tx.amount < 0 && !isTopup;
    var avatarClass = isGoldKind ? "gold" : (isTopup ? "topup" : (isOut ? "out" : "in"));
    var avatarIcon = isGoldKind ? ICONS.crown : (isTopup ? ICONS.plus : (isOut ? ICONS.txOut : ICONS.txIn));
    var heading = tx.purpose || (tx.amount > 0 ? "Надходження" : "Списання");

    var rows = "";
    if(tx.senderCard) rows += receiptRow("Картка відправника", maskCard(tx.senderCard), true);
    if(tx.receiverCard) rows += receiptRow("Картка отримувача", maskCard(tx.receiverCard), true);
    if(tx.purpose) rows += receiptRow("Призначення", tx.purpose);
    rows += receiptRow("Сума операції", fmt(Math.abs(tx.amount)));
    rows += receiptRow("Комісія", "0,00 " + CUR);
    rows += '<div class="receipt-row"><div class="k">Статус</div><div class="v"><span class="badge-ok">' + ICONS.checkCircle + ' Виконано (демо)</span></div></div>';

    modal.innerHTML =
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>Квитанція</h2><button class="close-x" id="modal-close">&times;</button></div>' +
      '<div class="receipt-hero"><div class="receipt-avatar ' + avatarClass + '">' + avatarIcon + '</div>' +
      '<div class="receipt-status">' + escapeHtml(heading) + '</div>' +
      '<div class="receipt-sub">' + formatDate(tx.date) + '</div></div>' +
      '<div class="receipt-rows">' + rows + '</div>' +
      '<button class="btn btn-ghost" id="receipt-close-btn" style="margin-top:20px;">Готово</button>';

    overlay.appendChild(modal);
    overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
    modal.querySelector("#modal-close").addEventListener("click", closeModal);
    modal.querySelector("#receipt-close-btn").addEventListener("click", closeModal);
    return overlay;
  }

  function receiptRow(label, value, isNum){
    return '<div class="receipt-row"><div class="k">' + escapeHtml(label) + '</div><div class="v' + (isNum ? " num" : "") + '">' + escapeHtml(value) + '</div></div>';
  }

  // ---------- boot ----------
  async function boot(){
    state.screen = "loading";
    render();
    var savedEmail = getSession();
    if(savedEmail){
      var user = null;
      try{ user = await getUser(savedEmail); }catch(e){ user = null; }
      if(user){
        state.email = savedEmail; state.user = user; state.screen = "home";
        render();
        startTimers();
        return;
      } else {
        setSession(null); state.screen = "email";
      }
    } else {
      state.screen = "email";
    }
    render();
  }

  boot();
})();
</script>
